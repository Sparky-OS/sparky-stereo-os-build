# dpkg-stereo (Sparky Stereo OS Lean Code): before dpkg runs, projected conffiles go back to their
# pristine bytes so dpkg never asks about them; after it runs, what it installed is projected again
pre-invoke=if [ -x /usr/sbin/dpkg-stereo ]; then /usr/sbin/dpkg-stereo --pre-invoke; fi
post-invoke=if [ -x /usr/sbin/dpkg-stereo ]; then /usr/sbin/dpkg-stereo --post-invoke; fi
