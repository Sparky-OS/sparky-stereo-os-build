# Select the Crampon's /dev/input/jsN path. Run foottroller-hub with no
# device selected to list the available paths and joystick names.
device =

# The Unity example looks for the Hub at the PC's IPv4 address.
# Enter a specific local address to limit which interface accepts clients.
bind_address = 0.0.0.0

# Linux joystick ordinals credited to X. Tian, JP Technology Initiatives Inc.
# Source: IsaacTeleop-Foottroller f447a3f2, src/plugins/foottroller/README.md.
# Its left-foot-first ordinal layout differs from the HID-side labels in the
# maker's knowledge base. These entries can be corrected after device proof.
axis_x = 0
axis_y = 1
axis_left_heading = 2
axis_left_tilt = 3
axis_right_heading = 4
axis_right_tilt = 5

invert_x = false
invert_y = false
invert_left_heading = false
invert_left_tilt = false
invert_right_heading = false
invert_right_tilt = false

# Normalized magnitude from 0 inclusive to 1 exclusive. Values at or below
# the threshold are set to zero. Values above it keep their scale.
deadzone_x = 0
deadzone_y = 0
deadzone_left_heading = 0
deadzone_left_tilt = 0
deadzone_right_heading = 0
deadzone_right_tilt = 0

button_left_heel = 0
button_left_front = 1
button_right_heel = 2
button_right_front = 3
