<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Kubabbar Glass 9 names the classic system fonts, Charcoal for the system font, menus and window titles (Chicago is
     its alternative), Geneva for the small font and Monaco for the fixed font, and uses them where the person has them
     installed. Where they are not, each name falls to the free font measured nearest to it, glyph by glyph: Noto Sans
     Display for Charcoal and Chicago, DejaVu Sans for Geneva, Inconsolata for Monaco. None of the classic fonts is
     shipped, bundled, converted or downloaded. GPL-3.0-only. -->
<fontconfig>
  <alias binding="same">
    <family>Charcoal</family>
    <accept><family>Noto Sans Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Chicago</family>
    <accept><family>Noto Sans Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Geneva</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Monaco</family>
    <accept><family>Inconsolata</family></accept>
  </alias>
</fontconfig>
