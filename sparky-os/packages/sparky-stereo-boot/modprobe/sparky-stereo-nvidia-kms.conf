# Sparky Stereo OS: NVIDIA's display driver with kernel mode setting and its framebuffer, so the boot
# splash, the console and KWin run on it (the driver's defaults since 560, set here so they stay).
# Run "update-initramfs -u" after a change: the boot image carries a copy (sparky-stereo-boot).
options nvidia-drm modeset=1 fbdev=1
