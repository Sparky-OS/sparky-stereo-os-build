# Sparky Stereo OS: a stereo boot splash is deactivated here instead of quit, so that the
# login screen's KWin takes its 3D mode over with no new mode set; sparky-stereo-boot-handover
# quits it after KWin's first frame. Every other boot quits the splash as before.
# Debian's unit ignores plymouth quit's status (ExecStart=-); this one fails when the hand-over
# fails or a running splash cannot be quit, and sparky-stereo-boot keeps the reason for the person.
[Service]
ExecStart=
ExecStart=/usr/bin/sparky-stereo-boot plymouth-quit
