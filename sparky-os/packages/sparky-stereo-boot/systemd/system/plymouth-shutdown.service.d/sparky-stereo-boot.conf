# Sparky Stereo OS: the splash of a restart or a shutdown shows the main screen as the person set it now. Debian's unit
# starts plymouthd with /proc/cmdline, the choice this boot started with; sparky-stereo-boot hands plymouthd the
# choice it exported last (/var/lib/sparky-stereo-boot/main-output.json) as its plymouth.stereo=, so a television made
# the main screen or put in 3D since the start keeps its mode to the end. Installed as plymouth-reboot.service.d,
# plymouth-poweroff.service.d, plymouth-halt.service.d and plymouth-kexec.service.d, with each unit's own mode.
[Service]
ExecStart=
ExecStart=/usr/bin/sparky-stereo-boot plymouth-shutdown @MODE@
