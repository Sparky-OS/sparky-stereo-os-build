# The console is quieter before the splash. Kernel messages still enter the log.
# Read the normal entry's arguments after other GRUB defaults have been sourced.
sparky_grub_console_default() (
    set -f
    quiet=no
    for arg in ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
        case "$arg" in
            loglevel=*|'"loglevel='*|"'loglevel="*|debug|'"debug"'|"'debug'") return 1 ;;
            quiet|'"quiet"'|"'quiet'") quiet=yes ;;
        esac
    done
    [ "$quiet" = yes ]
)

if [ "${SPARKY_STEREO_BOOT:-yes}" != no ] && sparky_grub_console_default; then
    GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }loglevel=3"
    export GRUB_CMDLINE_LINUX_DEFAULT
fi
unset -f sparky_grub_console_default
