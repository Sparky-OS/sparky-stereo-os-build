# Sparky Stereo OS: on 32-bit UEFI (EFI mixed mode), nokaslr while a kernel in /boot needs it (sparky-stereo-boot).
#
# 32-bit firmware returns from every firmware call through a small trampoline in the kernel image, at a 32-bit
# address. GRUB's linux command on 32-bit UEFI leaves the kernel's physical address to the kernel itself, and
# before the fix its randomization could put the kernel above 4 GiB on a machine with memory there: the address
# was cut to 32 bits and the first firmware call stopped the kernel ("kernel tried to execute NX-protected page").
# The edition's kernels from build 12 on (7.3.0-rc6-stereo3d12) stay below 4 GiB there and keep KASLR.
# GRUB gives every kernel in its menu the same command line, so nokaslr is added while any kernel in /boot lacks
# the fix (Debian's included), and dropped once every one has it. 64-bit UEFI and BIOS are not affected.
# It goes into GRUB_CMDLINE_LINUX, which the recovery entries get too.
# SPARKY_STEREO_IA32_NOKASLR in /etc/default/sparky-stereo-boot: auto (as above), yes (always on 32-bit UEFI),
# no (never). nokaslr written by the person in GRUB_CMDLINE_LINUX or GRUB_CMDLINE_LINUX_DEFAULT is always kept.
#
# Tests: SPARKY_STEREO_ROOT prefixes the paths read here (sysfs, /etc, /boot).

sparky_ia32_root=${SPARKY_STEREO_ROOT:-}

# true when kernel release $1 keeps itself below 4 GiB on 32-bit UEFI: the edition's kernels from build 12 on
sparky_ia32_kaslr_fixed() {
    case "$1" in
        *-stereo3d[0-9]*) ;;
        *) return 1 ;;
    esac
    sparky_ia32_n=${1##*-stereo3d}; sparky_ia32_n=${sparky_ia32_n%%[!0-9]*}
    sparky_ia32_base=${1%%-stereo3d*}; sparky_ia32_base=${sparky_ia32_base%-rt}
    sparky_ia32_base=$(printf '%s' "$sparky_ia32_base" | sed 's/-/~/')
    command -v dpkg >/dev/null || return 1
    dpkg --compare-versions "$sparky_ia32_base" gt 7.3.0~rc6 && return 0
    dpkg --compare-versions "$sparky_ia32_base" eq 7.3.0~rc6 && [ "$sparky_ia32_n" -ge 12 ]
}

# true when a kernel GRUB lists (10_linux's files and garbage rule) lacks the fix
sparky_ia32_needs_nokaslr() {
    for sparky_ia32_k in "$sparky_ia32_root"/boot/vmlinuz-* "$sparky_ia32_root"/vmlinuz-* "$sparky_ia32_root"/boot/kernel-*; do
        [ -f "$sparky_ia32_k" ] || continue
        case "$sparky_ia32_k" in
            *.dpkg-*|*.rpmsave|*.rpmnew|*/README*|*.sig) continue ;;
        esac
        sparky_ia32_kaslr_fixed "$(basename "$sparky_ia32_k" | sed -e 's,^[^0-9]*-,,g')" || return 0
    done
    return 1
}

sparky_stereo_ia32() {
    [ "$(cat "$sparky_ia32_root/sys/firmware/efi/fw_platform_size" 2>/dev/null)" = 32 ] || return 0
    SPARKY_STEREO_IA32_NOKASLR=auto
    [ -r "$sparky_ia32_root/etc/default/sparky-stereo-boot" ] && . "$sparky_ia32_root/etc/default/sparky-stereo-boot"
    case "$SPARKY_STEREO_IA32_NOKASLR" in
        no) return 0 ;;
        yes) ;;
        *) sparky_ia32_needs_nokaslr || return 0 ;;
    esac
    case " ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" nokaslr "*) ;;
        *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:-} nokaslr"
           export GRUB_CMDLINE_LINUX ;;
    esac
}

sparky_stereo_ia32 || true
