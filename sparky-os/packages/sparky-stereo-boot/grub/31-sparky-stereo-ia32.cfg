# Sparky Stereo OS: on 32-bit UEFI (EFI mixed mode) the kernel starts at a fixed physical address (sparky-stereo-boot).
#
# Linux returns from every firmware call through a small trampoline in its read-only data, which it maps without
# execute permission when its physical address is randomized: the first firmware call then stops the kernel
# ("kernel tried to execute NX-protected page"). At the fixed address (nokaslr) it boots. 64-bit UEFI and BIOS
# are not affected and keep the randomized address. Remove this file, or add nokaslr yourself, to choose.
if [ "$(cat /sys/firmware/efi/fw_platform_size 2>/dev/null)" = 32 ]; then
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" nokaslr "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-} nokaslr"
           export GRUB_CMDLINE_LINUX_DEFAULT ;;
    esac
fi
