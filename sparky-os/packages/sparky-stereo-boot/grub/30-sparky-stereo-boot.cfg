# Sparky Stereo OS: GRUB follows the main screen as the person set it (sparky-stereo-boot).
#
# grub-mkconfig (update-grub) sources every *.cfg in /etc/default/grub.d/ after /etc/default/grub.
# This file:
#   - shows GRUB at the resolution of the main screen's saved mode (the 2D base of a 3D mode,
#     /var/lib/sparky-stereo-boot/grub.cfg), else at the screen's native resolution, then the
#     fallbacks GRUB's EFI video driver can offer;
#   - keeps that mode for the kernel and the boot splash (gfxpayload=keep), so the screen does
#     not change resolution on the way, and the only change left is switching 3D on;
#   - adds ${sparky_stereo_boot} to the kernel line: GRUB fills it at boot from its environment
#     block (/boot/grub/grubenv), where sparky-stereo-boot writes the boot splash's stereo
#     layout and the console's mode, so a change of the saved choice needs no update-grub;
#   - picks a font whose pixel size gives the menu one physical text height on every screen
#     (the boot-chain study's sizing, 2026-10-07).
# It never changes what the person set: GRUB_GFXMODE, GRUB_GFXPAYLOAD_LINUX and GRUB_FONT in
# /etc/default/grub are kept.
# Nothing here stops update-grub, and nothing fails silently: the resolution GRUB is given is said in
# update-grub's output; no connected screen with an EDID, and a font that cannot be made, are said in the
# system's language and kept for repair (/usr/lib/sparky-stereo-boot/problems.py, sparky-stereo-boot status,
# and a notification after login); and what GRUB was given is written to /var/lib/sparky-stereo-boot/grub-display,
# which sparky-stereo-boot boot-check compares at boot with the resolution GRUB really showed. Options: /etc/default/sparky-stereo-boot (SPARKY_STEREO_BOOT=no
# leaves GRUB as it was; SPARKY_STEREO_GRUB=auto leaves its resolution to the firmware);
# GRUB_STEREO_TEXT_MM=4.2 and GRUB_STEREO_FONT=/path.ttf tune the font.
#
# Tests: SPARKY_STEREO_ROOT prefixes the paths read here (sysfs, /etc, /var/lib), SPARKY_FONT_DIR the folder
# for the fonts and SPARKY_STEREO_LIB the package's programs.

sparky_root=${SPARKY_STEREO_ROOT:-}
sparky_lib=${SPARKY_STEREO_LIB:-/usr/lib/sparky-stereo-boot}
sparky_byte() { od -An -tu1 -j "$2" -N 1 "$1" | tr -d ' \n'; }

# The package's messages, in the system's language (problems.py); in English when the package's programs are gone
# (this file is a conffile and stays until a purge).
sparky_tell() {   # sparky_tell say|record STEP KEY ENGLISH [ARG...]
    how=$1; step=$2; key=$3; english=$4; shift 4
    if [ -f "$sparky_lib/problems.py" ] && command -v python3 >/dev/null; then
        if [ "$how" = say ]; then
            python3 "$sparky_lib/problems.py" say "$key" "$@"
        else
            python3 "$sparky_lib/problems.py" record "$step" "$key" "$@" --repair update-grub
        fi
    else
        printf 'sparky-stereo-boot: %s\n' "$english" >&2
    fi
}
sparky_clear() {
    if [ -f "$sparky_lib/problems.py" ] && command -v python3 >/dev/null; then
        python3 "$sparky_lib/problems.py" clear "$1"
    fi
}

# Sets sparky_ha sparky_va sparky_hm sparky_vm (pixels and millimetres of the first detailed timing) and
# sparky_screen, from the saved main screen when it is connected, else from the screen GRUB is most likely shown on.
# Returns 1 when no connected screen has an EDID, 2 when the screen's EDID has no detailed timing.
sparky_display() {
    drm=$sparky_root/sys/class/drm
    best=''
    for dir in "$drm"/card*-*; do
        [ -r "$dir/status" ] && [ "$(cat "$dir/status")" = connected ] || continue
        [ -r "$dir/edid" ] && [ "$(wc -c < "$dir/edid")" -ge 128 ] || continue
        name=${dir##*/}
        if [ -n "${SPARKY_STEREO_CONNECTOR:-}" ] && [ "${name#*-}" = "$SPARKY_STEREO_CONNECTOR" ]; then
            best=$dir; break
        fi
        case "${dir##*/}" in
            *eDP*|*LVDS*|*DSI*) [ -n "${SPARKY_STEREO_CONNECTOR:-}" ] || { best=$dir; break; } ;;
        esac
        [ -n "$best" ] || best=$dir
    done
    [ -n "$best" ] || return 1
    sparky_screen=${best##*/}
    f=$best/edid
    for i in 54 55 56 58 59 61 66 67 68; do
        v=$(sparky_byte "$f" "$i")
        case "$v" in ''|*[!0-9]*) return 2 ;; esac
        eval "b$i=\$v"
    done
    [ "$b54$b55" != "00" ] || return 2
    sparky_ha=$(( b56 | ((b58 & 240) << 4) )); sparky_va=$(( b59 | ((b61 & 240) << 4) ))
    sparky_hm=$(( b66 | ((b68 & 240) << 4) )); sparky_vm=$(( b67 | ((b68 & 15) << 8) ))
    return 0
}

# What GRUB is given, for sparky-stereo-boot status and its check at boot; a failed write says its own error.
sparky_note() {   # sparky_note SOURCE (saved, native, person, firmware or off)
    d=$sparky_root/var/lib/sparky-stereo-boot
    first=${GRUB_GFXMODE:-}
    first=${first%%,*}
    if mkdir -p "$d" && printf 'GFXMODE=%s\nWANTED=%s\nSOURCE=%s\nFONT=%s\nPAYLOAD=%s\nSCREEN=%s\n' "${GRUB_GFXMODE:-}" \
        "${first:-auto}" "$1" "${GRUB_FONT:-}" "${GRUB_GFXPAYLOAD_LINUX:-}" "${sparky_screen:-}" > "$d/grub-display.new"; then
        mv -f "$d/grub-display.new" "$d/grub-display"
    fi
}

sparky_stereo_boot_grub() {
    SPARKY_STEREO_BOOT=yes
    SPARKY_STEREO_GRUB=native
    sparky_screen=''
    [ -r "$sparky_root/etc/default/sparky-stereo-boot" ] && . "$sparky_root/etc/default/sparky-stereo-boot"
    if [ "$SPARKY_STEREO_BOOT" = no ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note off
        return 0
    fi

    # the kernel line and the splash, from the environment block
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *'${sparky_stereo_boot}'*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-} \${sparky_stereo_boot}"
           export GRUB_CMDLINE_LINUX_DEFAULT ;;
    esac
    if [ -z "${GRUB_GFXPAYLOAD_LINUX:-}" ]; then
        GRUB_GFXPAYLOAD_LINUX=keep
        export GRUB_GFXPAYLOAD_LINUX
    fi

    if [ "$SPARKY_STEREO_GRUB" = auto ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note firmware
        return 0
    fi
    SPARKY_STEREO_GFXMODE=''
    SPARKY_STEREO_CONNECTOR=''
    [ -r "$sparky_root/var/lib/sparky-stereo-boot/grub.cfg" ] && . "$sparky_root/var/lib/sparky-stereo-boot/grub.cfg"
    source=person
    if [ -z "${GRUB_GFXMODE:-}" ] || [ "$GRUB_GFXMODE" = auto ]; then
        source=firmware
        if [ -n "${GRUB_FONT:-}" ] && [ -n "$SPARKY_STEREO_GFXMODE" ]; then
            source=saved   # the saved mode and the person's font: no screen needs measuring
        fi
    elif [ -n "${GRUB_FONT:-}" ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note person   # both the person's
        return 0
    fi

    sparky_ha=0; sparky_va=0; sparky_hm=0; sparky_vm=0
    found=0
    if [ "$source" != saved ]; then
        sparky_display; found=$?
    fi

    # 1. the resolution: the saved mode's, else the native one, then the modes GRUB's EFI and VESA drivers offer
    #    nearly everywhere (GRUB takes the first of its list the firmware offers, else its own choice)
    if [ "$source" != person ]; then
        list=$SPARKY_STEREO_GFXMODE
        [ -n "$list" ] && source=saved
        if [ -z "$list" ] && [ "$sparky_ha" -gt 0 ] && [ "$sparky_va" -gt 0 ]; then
            list=${sparky_ha}x${sparky_va}; source=native
        fi
        if [ -n "$list" ]; then
            first=${list%%,*}
            others=''
            for m in 1920x1080 1280x720 1024x768; do
                case ",$list," in *",$m,"*) ;; *) list=$list,$m; others="${others:+$others, }$m" ;; esac
            done
            GRUB_GFXMODE=$list,auto
            export GRUB_GFXMODE
            sparky_tell say - LOCAL47 "GRUB's resolution: $first; when the firmware does not offer it, the first it offers of $others, else its own" "$first" "$others"
        fi
    fi
    shown=${GRUB_GFXMODE:-}
    shown=${shown%%,*}
    if [ -n "$shown" ] && [ "$shown" != auto ]; then
        used=$shown; used_en=$shown
    else
        used=@LOCAL42; used_en="the firmware's resolution"
    fi

    # 2. the font, for the width GRUB shows: one physical text height, GRUB_STEREO_TEXT_MM (4.2 mm), the same on
    #    every screen, for a monitor at a desk (Daniel, 2026-11-02: "I sit at 50cm from the screen, I use it as a
    #    monitor, and people installing sparky will be installing on a PC, not in a television"; no larger text
    #    for screens that report a television's size). Sizes of projectors, VMs and some TVs are
    #    zero or placeholders (below 10 cm by 6 cm, an aspect outside 1.2 to 2.6, or 160 x 90 mm)
    #    and are not believed: GRUB's own font then, and update-grub's output says so.
    if [ -n "${GRUB_FONT:-}" ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note "$source"
        return 0
    fi
    sparky_clear grub-font
    if [ "$found" = 1 ]; then
        sparky_tell record grub-display LOCAL41 "At update-grub no connected screen reported its size (EDID), so GRUB's menu uses $used_en and GRUB's own font. With the main screen connected and on: sudo sparky-stereo-boot repair" "$used"
        sparky_note "$source"
        return 0
    fi
    sparky_clear grub-display
    hm=$sparky_hm; vm=$sparky_vm
    asp=0
    [ "$vm" -gt 0 ] && asp=$(( hm * 100 / vm ))
    if [ "$found" = 2 ] || [ "$hm" -lt 100 ] || [ "$vm" -lt 60 ] || [ "$asp" -lt 120 ] || [ "$asp" -gt 260 ] || \
            { [ "$hm" = 160 ] && [ "$vm" = 90 ]; }; then
        sparky_tell say - LOCAL43 "At update-grub the screen $sparky_screen gave no physical size in its EDID, so GRUB's menu uses $used_en and GRUB's own font." "$sparky_screen" "$used"
        sparky_note "$source"
        return 0
    fi
    sw=$shown
    sw=${sw%%x*}
    case "$sw" in ''|*[!0-9]*) sw=$sparky_ha ;; esac
    if [ "$sw" -le 0 ]; then
        sparky_note "$source"
        return 0
    fi
    mm=${GRUB_STEREO_TEXT_MM:-4.2}
    px=$(awk -v sw="$sw" -v hm="$hm" -v mm="$mm" 'BEGIN {
            px = mm * sw / hm;
            px = int(px / 2 + 0.5) * 2; if (px < 16) px = 16; if (px > 96) px = 96;
            print px }')
    # 18 px and below is what GRUB's own font does already
    case "$px" in ''|*[!0-9]*) px=0 ;; esac
    if [ "$px" -le 18 ]; then
        sparky_note "$source"
        return 0
    fi
    outdir=${SPARKY_FONT_DIR:-/boot/grub/fonts}
    font=$outdir/sparky-$px.pf2
    if [ ! -r "$font" ]; then
        ttf=${GRUB_STEREO_FONT:-}
        if [ -n "$ttf" ] && [ ! -r "$ttf" ]; then
            sparky_tell record grub-font LOCAL44 "GRUB's menu font of $px pixels could not be made: $ttf cannot be read. The menu keeps GRUB's own font. Then: sudo sparky-stereo-boot repair" "$px" "$ttf: cannot be read"
            sparky_note "$source"
            return 0
        fi
        if [ -z "$ttf" ]; then
            for t in /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf /usr/share/fonts/opentype/unifont/unifont.otf \
                     /usr/share/fonts/truetype/unifont/unifont.ttf; do
                [ -r "$t" ] && { ttf=$t; break; }
            done
        fi
        if [ -z "$ttf" ]; then
            sparky_tell record grub-font LOCAL45 "No TrueType font for GRUB's menu was found, so the menu keeps GRUB's own font. Install one (sudo apt-get install fonts-dejavu-core), then: sudo sparky-stereo-boot repair"
            sparky_note "$source"
            return 0
        fi
        if ! error=$(mkdir -p "$outdir" 2>&1 && grub-mkfont -s "$px" -o "$font" "$ttf" 2>&1); then
            rm -f "$font"
            error=$(printf '%s\n' "$error" | tail -n 3 | tr '\n' ' ')
            sparky_tell record grub-font LOCAL44 "GRUB's menu font of $px pixels could not be made: $error. The menu keeps GRUB's own font. Then: sudo sparky-stereo-boot repair" "$px" "${error% }"
            sparky_note "$source"
            return 0
        fi
    fi
    GRUB_FONT=$font
    export GRUB_FONT
    sparky_note "$source"
    return 0
}

# grub-mkconfig runs with set -e: the function runs as a condition, so a failing command inside it never ends
# update-grub; each step checks its own result and says what failed.
if sparky_stereo_boot_grub; then :; fi
