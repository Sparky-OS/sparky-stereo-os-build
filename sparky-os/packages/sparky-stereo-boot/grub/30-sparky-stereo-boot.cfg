# Sparky Stereo OS: GRUB follows the main screen as the person set it (sparky-stereo-boot).
#
# grub-mkconfig (update-grub) sources every *.cfg in /etc/default/grub.d/ after /etc/default/grub.
# This file:
#   - shows GRUB at the resolution of the main screen's saved mode (the 2D base of a 3D mode,
#     /var/lib/sparky-stereo-boot/grub.cfg), else at the screen's native resolution, then the
#     fallbacks GRUB's EFI video driver can offer;
#   - keeps that mode for the kernel and the boot splash (gfxpayload=keep), so the screen does
#     not change resolution on the way, and the only change left is switching 3D on;
#   - adds ${sparky_stereo_boot} to the kernel line: GRUB fills it at boot from its environment
#     block (/boot/grub/grubenv), where sparky-stereo-boot writes the boot splash's stereo
#     layout and the console's mode, so a change of the saved choice needs no update-grub;
#   - picks a font whose pixel size gives the menu one physical text height on every screen
#     (the boot-chain study's sizing, 2026-10-07), from the screen's size as its EDID gives it: the screen size
#     field (VESA E-EDID Release A2, 3.6.2: "The host (source) is expected to use this data to get a rough idea of
#     the image size to generate properly scaled text and icons"), with the first detailed timing's image size
#     (3.10.2, in millimetres) for the millimetres when the two agree; when they do not, the screen size field;
#   - under Secure Boot never names a font file: Debian's signed GRUB refuses every font outside its own image
#     (grub-core/kern/efi/sb.c: "prohibited by secure boot policy") and loads only the one bundled in it, 16 pixels
#     high (debian/build-efi-images: fonts/unicode.pf2 in the memdisk), so the text is brought to its height by the
#     resolution GRUB shows the menu at (SPARKY_STEREO_SECUREBOOT_TEXT=native keeps the screen's resolution);
#   - hides the menu and starts at once when this is the only system on the computer, and shows it when another
#     system is found (ORDER 572; Daniel, 2026-10-07 and 2026-11-14: "hidden grub, specially when there's only us
#     installed"; "if it has windows ok"); GRUB_TIMEOUT_STYLE, GRUB_HIDDEN_TIMEOUT or a GRUB_TIMEOUT other than
#     Debian's 5 in /etc/default/grub are the person's and are kept; SPARKY_STEREO_MENU=shown always shows it.
# It never changes what the person set: GRUB_GFXMODE, GRUB_GFXPAYLOAD_LINUX and GRUB_FONT in
# /etc/default/grub are kept.
# Nothing here stops update-grub, and nothing fails silently: the resolution GRUB is given is said in
# update-grub's output; no connected screen with an EDID, and a font that cannot be made, are said in the
# system's language and kept for repair (/usr/lib/sparky-stereo-boot/problems.py, sparky-stereo-boot status,
# and a notification after login); and what GRUB was given is written to /var/lib/sparky-stereo-boot/grub-display,
# which sparky-stereo-boot boot-check compares at boot with the resolution GRUB really showed. Options: /etc/default/sparky-stereo-boot (SPARKY_STEREO_BOOT=no
# leaves GRUB as it was; SPARKY_STEREO_GRUB=auto leaves its resolution to the firmware);
# GRUB_STEREO_TEXT_MM=4.2 and GRUB_STEREO_FONT=/path.ttf tune the font.
#
# Tests: SPARKY_STEREO_ROOT prefixes the paths read here (sysfs, /etc, /var/lib), SPARKY_FONT_DIR the folder
# for the fonts and SPARKY_STEREO_LIB the package's programs.

sparky_root=${SPARKY_STEREO_ROOT:-}
sparky_lib=${SPARKY_STEREO_LIB:-/usr/lib/sparky-stereo-boot}
sparky_byte() { od -An -tu1 -j "$2" -N 1 "$1" | tr -d ' \n'; }

# The package's messages, in the system's language (problems.py); in English when the package's programs are gone
# (this file is a conffile and stays until a purge).
sparky_tell() {   # sparky_tell say|record STEP KEY ENGLISH [ARG...]
    how=$1; step=$2; key=$3; english=$4; shift 4
    if [ -f "$sparky_lib/problems.py" ] && command -v python3 >/dev/null; then
        if [ "$how" = say ]; then
            python3 "$sparky_lib/problems.py" say "$key" "$@"
        else
            python3 "$sparky_lib/problems.py" record "$step" "$key" "$@" --repair update-grub
        fi
    else
        printf 'sparky-stereo-boot: %s\n' "$english" >&2
    fi
}
sparky_clear() {
    if [ -f "$sparky_lib/problems.py" ] && command -v python3 >/dev/null; then
        python3 "$sparky_lib/problems.py" clear "$1"
    fi
}

# Sets sparky_ha sparky_va sparky_hm sparky_vm (pixels and millimetres of the first detailed timing), sparky_cw
# sparky_ch (the screen size field, centimetres) and sparky_screen, from the saved main screen when it is connected,
# else from the screen GRUB is most likely shown on.
# Returns 1 when no connected screen has an EDID, 2 when the screen's EDID has no detailed timing.
sparky_display() {
    drm=$sparky_root/sys/class/drm
    best=''
    for dir in "$drm"/card*-*; do
        [ -r "$dir/status" ] && [ "$(cat "$dir/status")" = connected ] || continue
        [ -r "$dir/edid" ] && [ "$(wc -c < "$dir/edid")" -ge 128 ] || continue
        name=${dir##*/}
        if [ -n "${SPARKY_STEREO_CONNECTOR:-}" ] && [ "${name#*-}" = "$SPARKY_STEREO_CONNECTOR" ]; then
            best=$dir; break
        fi
        case "${dir##*/}" in
            *eDP*|*LVDS*|*DSI*) [ -n "${SPARKY_STEREO_CONNECTOR:-}" ] || { best=$dir; break; } ;;
        esac
        [ -n "$best" ] || best=$dir
    done
    [ -n "$best" ] || return 1
    sparky_screen=${best##*/}
    f=$best/edid
    for i in 21 22 54 55 56 58 59 61 66 67 68; do
        v=$(sparky_byte "$f" "$i")
        case "$v" in ''|*[!0-9]*) return 2 ;; esac
        eval "b$i=\$v"
    done
    [ "$b54$b55" != "00" ] || return 2
    sparky_ha=$(( b56 | ((b58 & 240) << 4) )); sparky_va=$(( b59 | ((b61 & 240) << 4) ))
    sparky_hm=$(( b66 | ((b68 & 240) << 4) )); sparky_vm=$(( b67 | ((b68 & 15) << 8) ))
    sparky_cw=$b21; sparky_ch=$b22
    return 0
}

# A size a screen can have: not zero, not a placeholder (below 10 cm by 6 cm, an aspect outside 1.2 to 2.6, 160 x 90 mm).
sparky_plausible() {   # sparky_plausible WIDTH_MM HEIGHT_MM
    [ "$1" -ge 100 ] && [ "$2" -ge 60 ] || return 1
    asp=$(( $1 * 100 / $2 ))
    [ "$asp" -ge 120 ] && [ "$asp" -le 260 ] || return 1
    if [ "$1" = 160 ] && [ "$2" = 90 ]; then return 1; fi
    return 0
}

# The firmware's Secure Boot state (the SecureBoot variable's value byte, after its four attribute bytes).
sparky_secureboot() {
    for v in "$sparky_root"/sys/firmware/efi/efivars/SecureBoot-*; do
        [ -r "$v" ] || continue
        if [ "$(od -An -tu1 -j 4 -N 1 "$v" 2>/dev/null | tr -d ' \n')" = 1 ]; then return 0; fi
    done
    return 1
}

# The menu: hidden with no wait when this is the only system, shown when another one is found (os-prober, when the
# installer or the person turned it on). The person's own GRUB_TIMEOUT_STYLE, GRUB_HIDDEN_TIMEOUT or GRUB_TIMEOUT win.
sparky_menu_rule() {
    sparky_menu=person
    if [ -n "${GRUB_TIMEOUT_STYLE:-}" ] || [ -n "${GRUB_HIDDEN_TIMEOUT:-}" ] || [ "${GRUB_TIMEOUT:-5}" != 5 ]; then
        sparky_tell say - LOCAL76 "GRUB's menu: your own settings are kept (GRUB_TIMEOUT_STYLE=${GRUB_TIMEOUT_STYLE:-}, GRUB_TIMEOUT=${GRUB_TIMEOUT:-})" "${GRUB_TIMEOUT_STYLE:--}" "${GRUB_TIMEOUT:--}"
        return 0
    fi
    other=''; why=''
    if [ "${SPARKY_STEREO_MENU:-auto}" = shown ]; then
        why=choice
    elif [ "${GRUB_DISABLE_OS_PROBER:-true}" = false ]; then
        prober=${SPARKY_OS_PROBER:-os-prober}
        if command -v "$prober" >/dev/null 2>&1; then
            if found=$("$prober" 2>/dev/null); then
                other=$(printf '%s\n' "$found" | awk -F: 'NF >= 2 && $2 != "" { print $2; exit }')
                [ -z "$other" ] || why=found
            else
                why=unknown
            fi
        fi
    fi
    if [ -n "$why" ]; then
        sparky_menu=shown
        GRUB_TIMEOUT_STYLE=menu; GRUB_TIMEOUT=5
        case $why in
            found) sparky_tell say - LOCAL77 "GRUB's menu is shown for $GRUB_TIMEOUT seconds: another system is on this computer ($other)" "$GRUB_TIMEOUT" "$other" ;;
            choice) sparky_tell say - LOCAL82 "GRUB's menu is shown for $GRUB_TIMEOUT seconds: SPARKY_STEREO_MENU=shown in /etc/default/sparky-stereo-boot" "$GRUB_TIMEOUT" ;;
            unknown) sparky_tell say - LOCAL78 "os-prober failed, so GRUB's menu is shown for $GRUB_TIMEOUT seconds: whether another system is on this computer is not known" "$GRUB_TIMEOUT" ;;
        esac
    else
        sparky_menu=hidden
        GRUB_TIMEOUT_STYLE=hidden; GRUB_TIMEOUT=0
        sparky_tell say - LOCAL79 "GRUB's menu is hidden and the system starts at once: it is the only system on this computer. To open the menu, hold Shift or press Esc while the computer starts. To always show it: SPARKY_STEREO_MENU=shown in /etc/default/sparky-stereo-boot, then: sudo update-grub"
    fi
    export GRUB_TIMEOUT_STYLE GRUB_TIMEOUT
    return 0
}

# What GRUB is given, for sparky-stereo-boot status and its check at boot; a failed write says its own error.
sparky_note() {   # sparky_note SOURCE (saved, native, person, firmware or off)
    d=$sparky_root/var/lib/sparky-stereo-boot
    first=${GRUB_GFXMODE:-}
    first=${first%%,*}
    # what this run exported, for a run that inherits it
    SPARKY_STEREO_OURS=1; SPARKY_STEREO_OURS_GFXMODE=''; SPARKY_STEREO_OURS_FONT=''; SPARKY_STEREO_OURS_MENU=''
    case "$1" in saved|native|readable) SPARKY_STEREO_OURS_GFXMODE=${GRUB_GFXMODE:-} ;; esac
    [ "${sparky_text:-}" != sized ] || SPARKY_STEREO_OURS_FONT=${GRUB_FONT:-}
    case "${sparky_menu:-}" in shown|hidden) SPARKY_STEREO_OURS_MENU="${GRUB_TIMEOUT_STYLE:-}|${GRUB_TIMEOUT:-}" ;; esac
    export SPARKY_STEREO_OURS SPARKY_STEREO_OURS_GFXMODE SPARKY_STEREO_OURS_FONT SPARKY_STEREO_OURS_MENU
    if mkdir -p "$d" && printf 'GFXMODE=%s\nWANTED=%s\nSOURCE=%s\nFONT=%s\nPAYLOAD=%s\nSCREEN=%s\nMENU=%s\nSECUREBOOT=%s\nTEXT=%s\n' "${GRUB_GFXMODE:-}" \
        "${first:-auto}" "$1" "${GRUB_FONT:-}" "${GRUB_GFXPAYLOAD_LINUX:-}" "${sparky_screen:-}" "${sparky_menu:-}" "${sparky_sb:-off}" \
        "${sparky_text:-}" > "$d/grub-display.new"; then
        mv -f "$d/grub-display.new" "$d/grub-display"
    fi
}

sparky_stereo_boot_grub() {
    SPARKY_STEREO_BOOT=yes
    SPARKY_STEREO_GRUB=native
    # sourced again in a process that inherited what this file exported (an update-grub started from inside another):
    # those values are this file's own, not the person's, and are worked out again
    if [ -n "${SPARKY_STEREO_OURS:-}" ]; then
        [ "${GRUB_GFXMODE:-}" != "${SPARKY_STEREO_OURS_GFXMODE:-}" ] || unset GRUB_GFXMODE
        [ "${GRUB_FONT:-}" != "${SPARKY_STEREO_OURS_FONT:-}" ] || unset GRUB_FONT
        if [ "${GRUB_TIMEOUT_STYLE:-}|${GRUB_TIMEOUT:-}" = "${SPARKY_STEREO_OURS_MENU:-}" ]; then
            unset GRUB_TIMEOUT_STYLE; GRUB_TIMEOUT=5
        fi
    fi
    SPARKY_STEREO_MENU=auto
    SPARKY_STEREO_SECUREBOOT_TEXT=readable
    sparky_screen=''; sparky_menu=''; sparky_text=''; sparky_sb=off
    [ -r "$sparky_root/etc/default/sparky-stereo-boot" ] && . "$sparky_root/etc/default/sparky-stereo-boot"
    if [ "$SPARKY_STEREO_BOOT" = no ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note off
        return 0
    fi
    if sparky_secureboot; then sparky_sb=on; fi
    sparky_menu_rule

    # the kernel line and the splash, from the environment block
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *'${sparky_stereo_boot}'*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-} \${sparky_stereo_boot}"
           export GRUB_CMDLINE_LINUX_DEFAULT ;;
    esac
    if [ -z "${GRUB_GFXPAYLOAD_LINUX:-}" ]; then
        GRUB_GFXPAYLOAD_LINUX=keep
        export GRUB_GFXPAYLOAD_LINUX
    fi

    if [ "$SPARKY_STEREO_GRUB" = auto ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note firmware
        return 0
    fi
    SPARKY_STEREO_GFXMODE=''
    SPARKY_STEREO_CONNECTOR=''
    [ -r "$sparky_root/var/lib/sparky-stereo-boot/grub.cfg" ] && . "$sparky_root/var/lib/sparky-stereo-boot/grub.cfg"
    source=person
    if [ -z "${GRUB_GFXMODE:-}" ] || [ "$GRUB_GFXMODE" = auto ]; then
        source=firmware
        if [ -n "${GRUB_FONT:-}" ] && [ -n "$SPARKY_STEREO_GFXMODE" ]; then
            source=saved   # the saved mode and the person's font: no screen needs measuring
        fi
    elif [ -n "${GRUB_FONT:-}" ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note person   # both the person's
        return 0
    fi

    sparky_ha=0; sparky_va=0; sparky_hm=0; sparky_vm=0; sparky_cw=0; sparky_ch=0
    found=0
    if [ "$source" != saved ]; then
        sparky_display; found=$?
    fi

    # 1. the resolution: the saved mode's, else the native one, then the modes GRUB's EFI and VESA drivers offer
    #    nearly everywhere (GRUB takes the first of its list the firmware offers, else its own choice)
    if [ "$source" != person ]; then
        list=$SPARKY_STEREO_GFXMODE
        [ -n "$list" ] && source=saved
        if [ -z "$list" ] && [ "$sparky_ha" -gt 0 ] && [ "$sparky_va" -gt 0 ]; then
            list=${sparky_ha}x${sparky_va}; source=native
        fi
        if [ -n "$list" ]; then
            first=${list%%,*}
            others=''
            for m in 1920x1080 1280x720 1024x768; do
                case ",$list," in *",$m,"*) ;; *) list=$list,$m; others="${others:+$others, }$m" ;; esac
            done
            GRUB_GFXMODE=$list,auto
            export GRUB_GFXMODE
            sparky_tell say - LOCAL47 "GRUB's resolution: $first; when the firmware does not offer it, the first it offers of $others, else its own" "$first" "$others"
        fi
    fi
    shown=${GRUB_GFXMODE:-}
    shown=${shown%%,*}
    if [ -n "$shown" ] && [ "$shown" != auto ]; then
        used=$shown; used_en=$shown
    else
        used=@LOCAL42; used_en="the firmware's resolution"
    fi

    # 2. the font, for the width GRUB shows: one physical text height, GRUB_STEREO_TEXT_MM (4.2 mm), the same on
    #    every screen, for a monitor at a desk (Daniel, 2026-11-02: "I sit at 50cm from the screen, I use it as a
    #    monitor, and people installing sparky will be installing on a PC, not in a television"; no larger text
    #    for screens that report a television's size). Sizes of projectors, VMs and some TVs are
    #    zero or placeholders (below 10 cm by 6 cm, an aspect outside 1.2 to 2.6, or 160 x 90 mm)
    #    and are not believed: GRUB's own font then, and update-grub's output says so.
    if [ -n "${GRUB_FONT:-}" ]; then
        sparky_clear grub-display; sparky_clear grub-font; sparky_note "$source"
        return 0
    fi
    sparky_clear grub-font
    if [ "$found" = 1 ]; then
        sparky_tell record grub-display LOCAL41 "At update-grub no connected screen reported its size (EDID), so GRUB's menu uses $used_en and GRUB's own font. With the main screen connected and on: sudo sparky-stereo-boot repair" "$used"
        sparky_note "$source"
        return 0
    fi
    sparky_clear grub-display
    # the screen's size: the screen size field (E-EDID 3.6.2, centimetres), the first detailed timing's image size
    # (3.10.2, millimetres) for the millimetres when it says the same screen (within the centimetre's rounding);
    # when the two differ, the screen size field, and update-grub says so
    hm=0; vm=0
    cw=$(( sparky_cw * 10 )); ch=$(( sparky_ch * 10 ))
    s_ok=no; t_ok=no
    if [ "$found" != 2 ]; then
        if sparky_plausible "$cw" "$ch"; then s_ok=yes; fi
        if sparky_plausible "$sparky_hm" "$sparky_vm"; then t_ok=yes; fi
    fi
    if [ "$s_ok" = yes ] && [ "$t_ok" = yes ]; then
        dh=$(( sparky_hm - cw )); dv=$(( sparky_vm - ch ))
        [ "$dh" -lt 0 ] && dh=$(( -dh )); [ "$dv" -lt 0 ] && dv=$(( -dv ))
        if [ "$dh" -le 10 ] && [ "$dv" -le 10 ]; then
            hm=$sparky_hm; vm=$sparky_vm
        else
            hm=$cw; vm=$ch
            sparky_tell say - LOCAL74 "The screen $sparky_screen gives two sizes in its EDID: $cw x $ch mm as the screen's size and $sparky_hm x $sparky_vm mm for its first timing. The menu's text is sized for the screen's size (VESA E-EDID 3.6.2)." "$sparky_screen" "$cw" "$ch" "$sparky_hm" "$sparky_vm"
        fi
    elif [ "$s_ok" = yes ]; then
        hm=$cw; vm=$ch
    elif [ "$t_ok" = yes ]; then
        hm=$sparky_hm; vm=$sparky_vm
    fi
    if [ "$hm" = 0 ]; then
        sparky_tell say - LOCAL43 "At update-grub the screen $sparky_screen gave no physical size in its EDID, so GRUB's menu uses $used_en and GRUB's own font." "$sparky_screen" "$used"
        sparky_note "$source"
        return 0
    fi
    sw=$shown
    sw=${sw%%x*}
    case "$sw" in ''|*[!0-9]*) sw=$sparky_ha ;; esac
    if [ "$sw" -le 0 ]; then
        sparky_note "$source"
        return 0
    fi
    mm=${GRUB_STEREO_TEXT_MM:-4.2}
    px=$(awk -v sw="$sw" -v hm="$hm" -v mm="$mm" 'BEGIN {
            px = mm * sw / hm;
            px = int(px / 2 + 0.5) * 2; if (px < 16) px = 16; if (px > 96) px = 96;
            print px }')
    # 18 px and below is what GRUB's own font does already
    case "$px" in ''|*[!0-9]*) px=0 ;; esac
    if [ "$px" -le 18 ]; then
        sparky_text=grub
        sparky_note "$source"
        return 0
    fi
    # the resolutions at which GRUB's own 16 pixel font has the wanted height on this screen, nearest first, of the
    # screen's own shape, then 1024x768: what the menu is shown at when no other font can be loaded (Secure Boot
    # with Debian's signed GRUB; a font file that is gone)
    sh=${shown#*x}
    case "$sh" in ''|*[!0-9]*) sh=$sparky_va ;; esac
    readable=$(awk -v sw="$sw" -v sh="$sh" -v px="$px" 'BEGIN {
            want = sw * 16 / px
            n = split("3840x2160 2560x1440 1920x1080 1600x900 1366x768 1280x720 2560x1600 1920x1200 1680x1050 1440x900 1280x800 1600x1200 1280x1024 1024x768 800x600", m, " ")
            shape = (sh > 0) ? sw / sh : 1.78
            out = ""
            for (k = 1; k <= 4; k++) {
                best = ""; bd = 1e9
                for (i = 1; i <= n; i++) {
                    split(m[i], wh, "x")
                    if (used[m[i]] || wh[1] + 0 >= sw + 0) continue
                    a = wh[1] / wh[2]; d = a - shape; if (d < 0) d = -d
                    if (d > 0.06) continue
                    d = wh[1] - want; if (d < 0) d = -d
                    if (d < bd) { bd = d; best = m[i] }
                }
                if (best == "") break
                used[best] = 1
                split(best, wh, "x")
                if (wh[1] + 0 > want * 1.6) continue
                out = out (out == "" ? "" : ",") best
            }
            if (!used["1024x768"] && sw + 0 > 1024) out = out (out == "" ? "" : ",") "1024x768"
            print out }')
    SPARKY_STEREO_READABLE_GFXMODE=${readable:+$readable,}auto
    export SPARKY_STEREO_READABLE_GFXMODE
    if [ "$sparky_sb" = on ]; then
        # no font file is named: the signed GRUB would refuse it and draw the menu with no font at all
        if [ "$SPARKY_STEREO_SECUREBOOT_TEXT" = native ] || [ "$source" = person ] || [ -z "$readable" ]; then
            sparky_text=grub
            sparky_tell say - LOCAL80 "Secure Boot is on: Debian's signed GRUB loads only the font inside it (16 pixels), so GRUB's menu has small text at $used_en on this screen." "$used"
            sparky_note "$source"
            return 0
        fi
        first=${readable%%,*}
        mmh=$(awk -v w="${first%%x*}" -v hm="$hm" 'BEGIN { printf "%.1f", 16 * hm / w }')
        GRUB_GFXMODE=$SPARKY_STEREO_READABLE_GFXMODE
        export GRUB_GFXMODE
        sparky_text=readable
        sparky_tell say - LOCAL75 "Secure Boot is on: Debian's signed GRUB loads only the font inside it (16 pixels), so GRUB's menu is shown at $first, where its text is about $mmh mm high on this screen (when the firmware does not offer it, the next it offers of $SPARKY_STEREO_READABLE_GFXMODE). To keep the screen's resolution and small text: SPARKY_STEREO_SECUREBOOT_TEXT=native in /etc/default/sparky-stereo-boot, then: sudo update-grub" "$first" "$mmh" "$SPARKY_STEREO_READABLE_GFXMODE"
        sparky_note readable
        return 0
    fi
    outdir=${SPARKY_FONT_DIR:-/boot/grub/fonts}
    font=$outdir/sparky-$px.pf2
    if [ ! -r "$font" ]; then
        ttf=${GRUB_STEREO_FONT:-}
        if [ -n "$ttf" ] && [ ! -r "$ttf" ]; then
            sparky_tell record grub-font LOCAL44 "GRUB's menu font of $px pixels could not be made: $ttf cannot be read. The menu keeps GRUB's own font. Then: sudo sparky-stereo-boot repair" "$px" "$ttf: cannot be read"
            sparky_note "$source"
            return 0
        fi
        if [ -z "$ttf" ]; then
            for t in /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf /usr/share/fonts/opentype/unifont/unifont.otf \
                     /usr/share/fonts/truetype/unifont/unifont.ttf; do
                [ -r "$t" ] && { ttf=$t; break; }
            done
        fi
        if [ -z "$ttf" ]; then
            sparky_tell record grub-font LOCAL45 "No TrueType font for GRUB's menu was found, so the menu keeps GRUB's own font. Install one (sudo apt-get install fonts-dejavu-core), then: sudo sparky-stereo-boot repair"
            sparky_note "$source"
            return 0
        fi
        if ! error=$(mkdir -p "$outdir" 2>&1 && grub-mkfont -s "$px" -o "$font" "$ttf" 2>&1); then
            rm -f "$font"
            error=$(printf '%s\n' "$error" | tail -n 3 | tr '\n' ' ')
            sparky_tell record grub-font LOCAL44 "GRUB's menu font of $px pixels could not be made: $error. The menu keeps GRUB's own font. Then: sudo sparky-stereo-boot repair" "$px" "${error% }"
            sparky_note "$source"
            return 0
        fi
    fi
    GRUB_FONT=$font
    export GRUB_FONT
    sparky_text=sized
    sparky_note "$source"
    return 0
}

# grub-mkconfig runs with set -e: the function runs as a condition, so a failing command inside it never ends
# update-grub; each step checks its own result and says what failed.
if sparky_stereo_boot_grub; then :; fi
