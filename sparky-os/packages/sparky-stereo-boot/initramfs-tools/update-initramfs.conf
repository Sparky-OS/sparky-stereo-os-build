#
# Configuration file for update-initramfs(8)
#
# Sparky Stereo OS (sparky-stereo-boot): all, so that every update-initramfs -u, the one every package trigger
# runs, writes the boot image of every installed kernel, not only the newest's. A boot splash, a firmware or a
# module change then reaches the older kernel too, the one kept to fall back to. initramfs-tools' own file is
# kept as /etc/initramfs-tools/update-initramfs.conf.debian and comes back when sparky-stereo-boot is removed.
#

#
# update_initramfs [ yes | all | no ]
#
# Default is yes
# If set to all update-initramfs will update all initramfs
# If set to no disables any update to initramfs beside kernel upgrade

update_initramfs=all

#
# backup_initramfs [ yes | no ]
#
# Default is no
# If set to no leaves no .bak backup files.

backup_initramfs=no
