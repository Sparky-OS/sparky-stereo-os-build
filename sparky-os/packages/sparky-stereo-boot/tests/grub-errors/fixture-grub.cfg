# The sections of a generated /boot/grub/grub.cfg that matter for GRUB's own errors: 00_header (with the edition's
# 30-sparky-stereo-boot.cfg and the artwork fragments applied), 05_debian_theme, 06_sparky_theme and the first entry of 10_linux.
### BEGIN /etc/grub.d/00_header ###
if [ -s $prefix/grubenv ]; then
  set have_grubenv=true
  load_env
fi

if [ "${env_block}" ] ; then
  set env_block="(${root})${env_block}"
  export env_block
  load_env -f "${env_block}"
fi

if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   if [ "${env_block}" ] ; then
     save_env -f "${env_block}" next_entry
   else
     save_env next_entry
   fi
   set boot_once=true
else
   set default="0"
fi

if [ x"${feature_menuentry_id}" = xy ]; then
  menuentry_id_option="--id"
else
  menuentry_id_option=""
fi

export menuentry_id_option

if [ "${prev_saved_entry}" ]; then
  set saved_entry="${prev_saved_entry}"
  save_env saved_entry
  set prev_saved_entry=
  save_env prev_saved_entry
  set boot_once=true
fi

function savedefault {
  if [ -z "${boot_once}" ]; then
    saved_entry="${chosen}"
    if [ "${env_block}" ] ; then
      save_env -f "${env_block}" saved_entry
    else
      save_env saved_entry
    fi

  fi
}
function load_video {
  if [ x$grub_platform = xefi ]; then
    insmod efi_gop
  elif [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
insmod part_gpt
insmod ext2
search --no-floppy --fs-uuid --set=root 82cc1979-cdf1-40c9-b04b-bcedc6f6a866
    font="/usr/share/grub/unicode.pf2"
fi

if loadfont $font ; then
  set gfxmode=1920x1080x32
  load_video
  insmod gfxterm
  set locale_dir=$prefix/locale
  set lang=pt_BR
  insmod gettext
fi
terminal_output gfxterm
insmod part_gpt
insmod ext2
search --no-floppy --fs-uuid --set=root 82cc1979-cdf1-40c9-b04b-bcedc6f6a866
insmod png
background_image -m stretch "/opt/artwork/sparky-black.png"
if [ "${recordfail}" = 1 ] ; then
  set timeout=30
else
  if [ x$feature_timeout_style = xy ] ; then
    set timeout_style=hidden
    set timeout=0
  # Fallback hidden-timeout code in case the timeout_style feature is
  # unavailable.
  elif sleep --interruptible 0 ; then
    set timeout=0
  fi
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/00_tuned ###
set tuned_params=""
export tuned_params
set tuned_initrd=""
export tuned_initrd
### END /etc/grub.d/00_tuned ###

### BEGIN /etc/grub.d/01_tuned ###
set tuned_params=""
set tuned_initrd=""
### END /etc/grub.d/01_tuned ###

### BEGIN /etc/grub.d/05_debian_theme ###
insmod part_gpt
insmod ext2
search --no-floppy --fs-uuid --set=root 82cc1979-cdf1-40c9-b04b-bcedc6f6a866
insmod png
if background_image "/opt/artwork/sparky-black.png"; then
  true
else
  set menu_color_normal=cyan/blue
  set menu_color_highlight=white/blue
fi
### END /etc/grub.d/05_debian_theme ###

### BEGIN /etc/grub.d/06_sparky_theme ###
insmod part_gpt
insmod ext2
search --no-floppy --fs-uuid --set=root 82cc1979-cdf1-40c9-b04b-bcedc6f6a866
insmod png
if background_image /opt/artwork/sparky-black.png; then
  true
else
  set menu_color_normal=cyan/blue
  set menu_color_highlight=white/blue
fi
### END /etc/grub.d/06_sparky_theme ###

### BEGIN /etc/grub.d/10_linux ###
set linux_gfx_mode=keep
export linux_gfx_mode
menuentry 'Sparky Stereo OS GNU/Linux' --class sparky --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-82cc1979-cdf1-40c9-b04b-bcedc6f6a866' {
	load_video
	set gfxpayload=$linux_gfx_mode
	insmod gzio
	if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 82cc1979-cdf1-40c9-b04b-bcedc6f6a866
	echo	'Loading Linux 7.3.1-stereo3d16 ...'
	linux	/boot/vmlinuz-7.3.1-stereo3d16 root=UUID=82cc1979-cdf1-40c9-b04b-bcedc6f6a866 ro  quiet splash
	echo	'Loading initial ramdisk ...'
	initrd	/boot/initrd.img-7.3.1-stereo3d16
}
