# Hibernation on a system whose boot images dracut builds: the image resumes through dracut's resume module
# (systemd-hibernate-resume in a systemd initramfs), from resume= and resume_offset= on the kernel command line.
# In a host-only image the module's own check leaves it out while the kernel has no resume device yet
# (hostonly_mode="strict"), which is where a system that never hibernated stands; a module named in
# add_dracutmodules is taken even then (dracut.conf(5)).
add_dracutmodules+=" resume "
