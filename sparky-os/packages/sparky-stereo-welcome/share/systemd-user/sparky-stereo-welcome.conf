# Sparky Welcome's first-run start (sparky-welcome's /etc/xdg/autostart/sparky-welcome-first.desktop, a unit made by
# systemd-xdg-autostart-generator) is skipped where KDE's Welcome Center carries the edition's first pages: that is the
# first run now, with every element of Sparky Welcome on its SparkyLinux page. Sparky Welcome stays installed and in the
# menu as Welcome. This file leaves with sparky-stereo-welcome, and Sparky Welcome's first run comes back with it.
[Unit]
ConditionPathExists=!/usr/share/plasma/plasma-welcome/first-pages/00-SparkyStereoOS.qml
