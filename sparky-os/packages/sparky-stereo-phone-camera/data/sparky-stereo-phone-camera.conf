# The virtual camera the phone's picture goes to. With exclusive_caps=0 (the module's default) the device is a camera at once, so PipeWire
# lists it, and System Settings, Camera shows it, as soon as the module is loaded (sparky-phone-camera loads it when a phone session starts and
# removes it when the session ends); its picture is empty until a program writes to it.
# To keep it always listed, add a file /etc/modules-load.d/phone-camera.conf with the line v4l2loopback; the command then leaves it loaded.
# For a program that reads /dev/video itself and wants a camera with no output side (some browsers), write exclusive_caps=1 here:
# the device is then a camera only while a program writes to it, and PipeWire lists it only after "sparky-phone-camera announce".
options v4l2loopback devices=1 exclusive_caps=0 card_label="Phone camera"
