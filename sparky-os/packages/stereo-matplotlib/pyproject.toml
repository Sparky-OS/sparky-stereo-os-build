[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-matplotlib"
version = "0.1.1"
description = "Matplotlib's 3D plots in stereo on Sparky Stereo OS: two parallel cameras fitted to the person's depth limits"
license = "MIT"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["stereo_matplotlib"]
