# Sparky Stereo OS: pkcs11-daemon serves the PKCS#11 library named in /etc/default/pkcs11-daemon,
# SoftHSM's by default, which the package does not install. Until that library exists the service
# is skipped instead of failing at every boot; point PKCS11_LIB at a token's library to use it.
[Service]
ExecCondition=/usr/bin/test -e ${PKCS11_LIB}
