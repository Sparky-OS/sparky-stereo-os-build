# Sparky Stereo OS: pkcs11-daemon serves the PKCS#11 library named in /etc/default/pkcs11-daemon, SoftHSM's by
# default (/usr/lib/softhsm/libsofthsm2.so). Debian's pkcs11-daemon does not depend on it, so it stopped at every
# boot: the edition's pkcs11-daemon (0.4.1-5+sparky1) depends on libsofthsm2. If it still cannot load its library
# (PKCS11_LIB pointed at a token's library that is not installed), its failure is said and kept with what to do
# (sparky-stereo-service-problem@) instead of being skipped.
[Unit]
# The adjacent 50-sparky-stereo-problems.conf mask leaves out the engine's generic handler.
# This package keeps its own diagnostic and Repair through the same engine.
OnFailure=
OnFailure=sparky-stereo-service-problem@%n.service

[Service]
ExecStartPost=-/usr/bin/sparky-stereo-service-defaults clear %n
