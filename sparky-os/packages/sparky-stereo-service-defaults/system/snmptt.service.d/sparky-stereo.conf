# Sparky Stereo OS: snmptt.ini turns IPv6 on (ipv6_enable = 1), which needs the Perl module Net::IP
# (libnet-ip-perl), and snmptt does not depend on it: it stopped with "Could not load the Perl
# module Net::IP!", status 2, at every boot. Until Net::IP is installed the service is skipped,
# unless IPv6 is turned off in snmptt.ini.
[Service]
ExecCondition=/bin/sh -c 'perl -MNet::IP -e 1 2>/dev/null || ! grep -Eq "^[[:space:]]*ipv6_enable[[:space:]]*=[[:space:]]*1" /etc/snmp/snmptt.ini'
