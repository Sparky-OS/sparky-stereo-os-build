# Sparky Stereo OS: snmptt.ini turns IPv6 on (ipv6_enable = 1, snmptt's own default), which needs the Perl module
# Net::IP (libnet-ip-perl). Debian's snmptt does not depend on it, so it stopped with "Could not load the Perl
# module Net::IP!" at every boot: the edition's snmptt (1.5-3+sparky1) depends on it. If snmptt still cannot start,
# its failure is said and kept (sparky-stereo-service-problem@) instead of being skipped.
[Unit]
OnFailure=sparky-stereo-service-problem@%n.service

[Service]
ExecStartPost=-/usr/bin/sparky-stereo-service-defaults clear %n
