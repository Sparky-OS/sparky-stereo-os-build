# Sparky Stereo OS: urfkill works through ConsoleKit ("failed to setup proxy for consolekit"),
# which Debian no longer ships; systemd-logind replaced it. The service starts when a ConsoleKit
# service is installed and is skipped otherwise, instead of failing at every boot.
[Unit]
ConditionPathExists=/usr/share/dbus-1/system-services/org.freedesktop.ConsoleKit.service
