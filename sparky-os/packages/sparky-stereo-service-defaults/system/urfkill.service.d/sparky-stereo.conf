# Sparky Stereo OS: Debian's urfkill 0.5.0-8 tracks sessions through ConsoleKit ("failed to setup proxy for
# consolekit"), while the system runs systemd-logind: its debian/rules lost "--with-session-tracking=systemd" to a missing
# backslash (Debian bug #1152866, our report with the patch). The edition's urfkill 0.5.0-8+sparky1 (packages/urfkill)
# asks logind, and this package Breaks Debian's. Where a urfkill that cannot start is installed anyway, its failure is said
# and kept with the reason (sparky-stereo-service-problem@) instead of being skipped; radio switches work without it
# (systemd-rfkill, Plasma).
[Unit]
# The adjacent 50-sparky-stereo-problems.conf mask leaves out the engine's generic handler.
# This package keeps its own diagnostic and Repair through the same engine.
OnFailure=
OnFailure=sparky-stereo-service-problem@%n.service

[Service]
ExecStartPost=-/usr/bin/sparky-stereo-service-defaults clear %n
