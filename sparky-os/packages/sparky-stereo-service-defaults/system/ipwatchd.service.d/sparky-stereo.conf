# Sparky Stereo OS: ipwatchd watches the interfaces that have an IPv4 address when it starts
# ("iface_configuration automatic"). Started at boot before any interface has one, it stopped with "No interfaces
# discovered", status 2. It waits while no interface has an address (status 1, a skip), and NetworkManager starts
# it when one comes up (dispatcher script 90-sparky-stereo-ipwatchd). A probe that fails is not "no address": it
# is said and kept, and the unit fails (status 255).
[Unit]
# The adjacent 50-sparky-stereo-problems.conf mask leaves out the engine's generic handler.
# This package keeps its own diagnostic and Repair through the same engine.
OnFailure=
OnFailure=sparky-stereo-service-problem@%n.service

[Service]
ExecCondition=/usr/bin/sparky-stereo-service-defaults needed ipwatchd
ExecStartPost=-/usr/bin/sparky-stereo-service-defaults clear %n
