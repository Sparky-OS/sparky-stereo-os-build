# Sparky Stereo OS: ipwatchd watches the interfaces that have an IPv4 address when it starts
# ("iface_configuration automatic"). Started at boot before any interface has one, it stopped with
# "No interfaces discovered", status 2. It is skipped while no interface has an address, and
# NetworkManager starts it when one comes up (dispatcher script 90-sparky-stereo-ipwatchd).
[Service]
ExecCondition=/bin/sh -c 'ip -4 -o address show scope global | grep -q .'
