# Sparky Stereo OS: xfsprogs enables xfs_healer@- for /, and on a root that is not XFS "xfs_healer --supported" ended
# with status 255, a failure, at every boot. Upstream fixed it (xfsprogs fde1eee, "xfs_healer: fail earlier on
# non-xfs filesystems", by Darrick J. Wong; Debian bug #1149571): it now says "XFS health monitoring not supported."
# and ends with status 1, so systemd skips the unit. The edition's xfsprogs 7.2.0-1+sparky1 carries that fix; any
# other failure of the healer is said and kept (sparky-stereo-service-problem@).
[Unit]
# The adjacent 50-sparky-stereo-problems.conf mask leaves out the engine's generic handler.
# This package keeps its own diagnostic and Repair through the same engine.
OnFailure=
OnFailure=sparky-stereo-service-problem@%n.service

[Service]
ExecStartPost=-/usr/bin/sparky-stereo-service-defaults clear %n
