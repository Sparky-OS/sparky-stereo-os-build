# Sparky Stereo OS: xfs_healer_start starts an instance for mounts that are not XFS too, and
# "xfs_healer --supported" ends with status 255 there ("Inappropriate ioctl for device"), which
# systemd counts as a failure rather than a skip: on an ext4 root xfs_healer@- failed at every boot.
# The file system type is checked first; on XFS the program's own check runs as before.
[Service]
ExecCondition=
ExecCondition=/bin/sh -c 'test "$$(findmnt -n -o FSTYPE --mountpoint "$$1")" = xfs' sh %f
ExecCondition=/usr/libexec/xfsprogs/xfs_healer --supported %f
