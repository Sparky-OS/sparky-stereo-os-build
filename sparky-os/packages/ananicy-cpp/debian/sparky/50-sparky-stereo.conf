# Sparky Stereo OS: ananicy-cpp is on by default as CachyOS ships it (ORDER 108), and a start that cannot happen is told, never looped or silent.
[Service]
Type=notify
Restart=on-failure
RestartPreventExitStatus=1
ExecStartPre=-/usr/libexec/sparky-ananicy-cpp/clean
ExecStartPost=/usr/libexec/sparky-ananicy-cpp/started
ExecStopPost=/usr/libexec/sparky-ananicy-cpp/stopped
