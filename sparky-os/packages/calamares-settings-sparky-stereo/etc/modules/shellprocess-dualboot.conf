# Sparky Stereo OS: installed beside Windows, the system keeps the hardware clock in local time, as
# Windows does (Calamares' hwclock module writes UTC), and lists Windows in its boot menu (os-prober,
# which Debian leaves off by default). The other clock setting, Windows in UTC, is in the edition's guide.
---
dontChroot: false
timeout: 120
script:
    - "-/usr/lib/calamares-settings-sparky-stereo/dual-boot"
