# Sparky Stereo OS: the image's local packages for SparkyLinux's apt steps (grubefiinstall and
# securebootinstall), so they work without a network connection; "on" before them, "off" after.
---
dontChroot: false
timeout: 60
script:
    - "-/usr/lib/calamares-settings-sparky-stereo/offline-packages off"
