# Sparky Stereo OS: the image's local packages for SparkyLinux's apt steps (grubefiinstall and
# securebootinstall), so they work without a network connection; "on" before them, "off" after.
# "off" runs from the live system on the installed system's files: by then the packages step has
# removed the installer and this package from the installed system.
---
dontChroot: true
timeout: 60
script:
    - "-env OFFLINE=${ROOT}/usr/share/sparky-stereo/offline-debs APT_DIR=${ROOT}/etc/apt LISTS=${ROOT}/var/lib/apt/lists /usr/lib/calamares-settings-sparky-stereo/offline-packages off"
