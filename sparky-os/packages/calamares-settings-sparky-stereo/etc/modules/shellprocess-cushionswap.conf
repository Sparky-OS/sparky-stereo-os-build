# Sparky Stereo OS: the swap area the installer just made becomes the Cushion Swap area (ORDER 572).
# Runs in the installed system right after the fstab step wrote /etc/fstab: Cushion Swap marks the swap line
# noauto, so the area is off at boot and switched on only when memory runs short (Daniel's design), and never
# reports "no swap area is configured" on a fresh install. The native fstab
# job writes the hibernation target for the initramfs. The selected automatic
# layout can use this area or a separate partition. A failure stops the
# installation with its message.
---
dontChroot: false
timeout: 30
script:
    - "/usr/sbin/cushion-swap --adopt installer"
