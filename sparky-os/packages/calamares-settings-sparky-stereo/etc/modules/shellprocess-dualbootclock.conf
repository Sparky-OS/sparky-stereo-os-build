# Sparky Stereo OS: Windows keeps the hardware clock in local time and Linux in UTC, and Calamares'
# hwclock module writes UTC. Installed beside Windows, the system keeps the hardware clock in local
# time too, so both show the right time (the other way, Windows in UTC, is in the edition's guide).
---
dontChroot: false
timeout: 120
script:
    - "-/usr/lib/calamares-settings-sparky-stereo/dual-boot-clock"
