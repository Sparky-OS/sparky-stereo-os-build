# Sparky Stereo OS: GRUB's menu in the installed system's language (calamares-settings-sparky-stereo).
# Runs from the live system on the installed system's files: the packages step removed the installer,
# and this package with it, from the installed system.
---
dontChroot: true
timeout: 300
script:
    - "-env ROOT=${ROOT} /usr/lib/calamares-settings-sparky-stereo/grub-language"
