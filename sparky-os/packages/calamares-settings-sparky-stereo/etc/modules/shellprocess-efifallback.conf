# Sparky Stereo OS: the EFI fallback path (EFI/BOOT/BOOTX64.EFI), written after the bootloader step:
# our signed chain (shim, GRUB, MokManager) on a machine with no other system, nothing where Windows
# or another system keeps its own fallback loader. Calamares' own copy (GRUB alone) is off in
# bootloader.conf. Run from the live system on the installed system's EFI partition: by now the
# packages step has removed the installer and this package from the installed system.
---
dontChroot: true
timeout: 120
script:
    - "-env ESP=${ROOT}/boot/efi ROOT=${ROOT} /usr/lib/calamares-settings-sparky-stereo/efi-fallback"
