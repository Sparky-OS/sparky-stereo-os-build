# Sparky Stereo OS: the packages of the language chosen for the new system are added with the Locale tool (study 252, J8).
# Runs from the live system on the installed system's files; the work is chrooted by the script. A language that cannot be
# added does not stop the installation: it is said in the log and kept for the new system by the problems engine.
---
dontChroot: true
timeout: 1800
script:
    - "env INSTALLER_LANG=${LANG} ROOT=${ROOT} /usr/lib/calamares-settings-sparky-stereo/language-packs"
