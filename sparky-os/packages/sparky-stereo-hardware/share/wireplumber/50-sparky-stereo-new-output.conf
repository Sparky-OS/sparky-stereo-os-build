# A newly connected headset or speaker (Bluetooth or USB) takes the sound and hands it back when it leaves (ORDER 129); the hook is
# /usr/share/wireplumber/scripts/sparky-stereo-new-output.lua. To turn it off for one person: a file in
# ~/.config/wireplumber/wireplumber.conf.d with
#   wireplumber.settings = { sparky.new-output-takes-the-sound = false }
# The script is an optional extra: WirePlumber loads a component only when a required feature requires or wants it
# (a profile entry "optional" alone loads nothing, and "required" would stop WirePlumber, and the person's sound, if the
# script ever failed to load, for example after a WirePlumber upgrade that changes the Lua API). So the profile requires
# a small virtual component, which cannot fail, and that component only wants the script: a failure is logged by
# WirePlumber (an error line naming sparky-stereo-new-output.lua in the user journal) and everything else keeps working.
wireplumber.components = [
  {
    name = sparky-stereo-new-output.lua, type = script/lua
    provides = hooks.sparky.new-output-takes-the-sound
  }
  {
    type = virtual, provides = policy.sparky-new-output
    wants = [ hooks.sparky.new-output-takes-the-sound ]
  }
]

wireplumber.profiles = {
  main = {
    policy.sparky-new-output = required
  }
}

wireplumber.settings.schema = {
  sparky.new-output-takes-the-sound = {
    name = "A newly connected headset or speaker takes the sound"
    description = "A Bluetooth audio device or a USB audio output that connects while the session runs becomes the sound output, and the chosen output comes back when it leaves. Outputs already there when the session starts do not move it"
    type = "bool"
    default = true
  }
}
