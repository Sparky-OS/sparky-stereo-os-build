# A newly connected headset takes the sound and hands it back when it leaves (ORDER 129); the hook is
# /usr/share/wireplumber/scripts/sparky-stereo-headset.lua. To turn it off for one person: a file in
# ~/.config/wireplumber/wireplumber.conf.d with
#   wireplumber.settings = { sparky.headset-takes-the-sound = false }
wireplumber.components = [
  {
    name = sparky-stereo-headset.lua, type = script/lua
    provides = hooks.sparky.headset-takes-the-sound
  }
]

wireplumber.profiles = {
  main = {
    hooks.sparky.headset-takes-the-sound = required
  }
}

wireplumber.settings.schema = {
  sparky.headset-takes-the-sound = {
    name = "A newly connected headset takes the sound"
    description = "A Bluetooth audio device or a USB headset that connects becomes the sound output, and the chosen output comes back when it leaves"
    type = "bool"
    default = true
  }
}
