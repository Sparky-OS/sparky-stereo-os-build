# Sparky Stereo OS: the kernel options of the corrections that are on for this computer (sparky-stereo-hardware's
# known-machines table; ORDER 669). grub-mkconfig (update-grub) sources every *.cfg in /etc/default/grub.d/ after
# /etc/default/grub. A computer that is not in the table gets nothing. An iMac14,1 gets acpi_mask_gpe=0x06: its
# firmware event GPE 06 fires thousands of times a second under Linux and keeps about half a processor core busy.
# sparky-stereo-known-machines --list shows what applies here; --off ID turns one off (then: sudo update-grub).
# Sourced more than once by other scripts of /etc/grub.d: an option already on the line is not added again.
if [ -x /usr/bin/sparky-stereo-known-machines ]; then
	for sparky_known_option in $(/usr/bin/sparky-stereo-known-machines --kernel-options 2>/dev/null); do
		case " ${GRUB_CMDLINE_LINUX:-} " in
		*" $sparky_known_option "*) ;;
		*) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }$sparky_known_option" ;;
		esac
	done
	unset sparky_known_option
fi
