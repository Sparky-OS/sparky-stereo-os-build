# The OpenGL stereo default (sparky-stereo-opengl.sh) is for the session's programs: KWin and
# its Xwayland keep the driver of the card they render on.
[Service]
UnsetEnvironment=SPARKY_STEREO_OPENGL __EGL_VENDOR_LIBRARY_FILENAMES __GLX_VENDOR_LIBRARY_NAME MESA_LOADER_DRIVER_OVERRIDE LIBGL_KOPPER_DISABLE
