# Broadcom's wl driver keeps its Wi-Fi connected: power saving off and the card's own address, for cards driven by wl only.
# Daniel, 2026-11-23: "with newer kernels, we must disable power management (by tag powersave = 2) and disable mac
# randomization"; "wl only is right". Every section matches on the driver: NetworkManager.conf(5), APPENDIX "Device List
# Format", driver:DRIVER, the exact name `nmcli -f GENERAL.DRIVER device show` reports. No other card's defaults change.
# These are defaults: a profile's own value wins (NetworkManager.conf(5), CONNECTION SECTION: a default is consulted only
# when the profile's property asks for the default). A file of the same name in /etc/NetworkManager/conf.d shadows this
# one (NetworkManager.conf(5), DESCRIPTION).

# NetworkManager.conf(5), DEVICE SECTION, wifi.scan-rand-mac-address: "no" leaves the card's address unchanged while it
# scans. Debian's wpasupplicant ships the same setting for wl (/usr/lib/NetworkManager/conf.d/no-mac-addr-change.conf).
[device-sparky-stereo-wl]
match-device=driver:wl
wifi.scan-rand-mac-address=no

# NetworkManager.conf(5), CONNECTION SECTION, Supported Properties: wifi.powersave and wifi.cloned-mac-address.
[connection-sparky-stereo-wl]
match-device=driver:wl
# nm-settings-nmcli(5), 802-11-wireless.powersave: "disable" (2) disables Wi-Fi power saving; the file takes the number
# (NetworkManager.conf(5), CONNECTION SECTION: enum values "only can be configured via their numeric magic number").
wifi.powersave=2
# nm-settings-nmcli(5), 802-11-wireless.cloned-mac-address: "permanent" means the permanent hardware address of the device,
# never a random or generated one.
wifi.cloned-mac-address=permanent
