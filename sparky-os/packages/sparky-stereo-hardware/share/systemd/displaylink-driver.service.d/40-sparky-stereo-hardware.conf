# A persistent startup error is tried once. The vendor's USB add rule can start
# the service again after the cause is repaired; its startup steps stay intact.
[Service]
Restart=on-abnormal
ExecStartPost=/usr/lib/sparky-stereo-hardware/displaylink-status ready
ExecStopPost=/usr/lib/sparky-stereo-hardware/displaylink-status stopped
