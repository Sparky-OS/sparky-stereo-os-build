# NVIDIA's nvidia-imex is the IMEX daemon of multi-node NVLink systems. Its package enables it at install and its
# config.cfg points at IMEX_NODE_CONFIG_FILE=/etc/nvidia-imex/nodes_config.cfg, a file the package does not ship and an
# administrator writes for an IMEX domain. Without that file the unit has nothing to run: it is skipped (not "failed"),
# decided at every boot, and a system whose administrator wrote the file runs it as NVIDIA built it. No package of the
# edition installs it (the open and 580 stacks leave it out); this covers a person who installs it by hand.
[Unit]
ConditionPathExists=/etc/nvidia-imex/nodes_config.cfg
