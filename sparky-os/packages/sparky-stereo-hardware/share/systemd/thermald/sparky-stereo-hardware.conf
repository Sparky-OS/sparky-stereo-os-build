# thermald runs on Intel CPUs only: on any other vendor it prints "Unsupported cpu model or platform" and leaves without
# taking its bus name, so its unit failed at every boot (found on a Ryzen 5 5600G). Hardware Setup installs thermald where
# the CPU is Intel; a machine that has it from an earlier image, or from the person's own apt, skips it here (decided at
# every boot, not "failed") and an Intel machine runs it as before. systemd.service(5): ExecCondition= with an exit status
# of 1 to 254 skips the unit without failing it.
[Service]
ExecCondition=/usr/bin/grep -qs '^vendor_id[[:space:]]*:[[:space:]]*GenuineIntel' /proc/cpuinfo
