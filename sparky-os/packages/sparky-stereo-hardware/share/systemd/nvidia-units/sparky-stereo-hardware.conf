# NVIDIA's packages enable this unit for every boot. It runs only while NVIDIA's driver is loaded, which udev does
# when it finds an NVIDIA card, decided again at every boot: a machine without one skips it (not "failed"), and a
# card added later starts it with no step (71-sparky-stereo-nvidia-units.rules pulls it in when the driver loads).
[Unit]
ConditionPathExists=/sys/module/nvidia
