# Sparky Stereo OS (ORDER 350): every system service that fails is told, with its own last lines and systemd's
# restart as the repair (sparky-stereo-problems service-failed). A top-level drop-in, systemd.unit(5), "Top level
# drop-ins with template units"; the handler's own instances have this file masked (/dev/null), as the same page says,
# so a handler that fails never starts another.
[Unit]
OnFailure=sparky-stereo-problems-failed@%N.service
