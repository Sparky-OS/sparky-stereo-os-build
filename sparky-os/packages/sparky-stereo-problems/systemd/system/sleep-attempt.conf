# Sparky Stereo OS (ORDER 446): suspend-then-hibernate and hybrid sleep suspend instead when the hibernation fails, and the
# service then ends well (systemd-sleep.c: "Couldn't hibernate, will try to suspend again"), so no OnFailure= runs. At the
# end of the service the engine reads that attempt's journal: a hibernation that failed is told with its reason, one that
# worked ends the problem of the last. systemd.service(5): $SERVICE_RESULT is passed to ExecStopPost=; the handler of a
# failed service is the OnFailure= one. The leading "-" keeps a failing reader from failing the person's sleep: it says
# its own failure.
[Service]
ExecStopPost=-/usr/bin/sparky-stereo-problems sleep-attempt %n
