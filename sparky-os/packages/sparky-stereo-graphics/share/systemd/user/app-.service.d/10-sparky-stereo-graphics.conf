# ORDER 467. KIO runs every program of a desktop entry as app-NAME@ID.service on the session's systemd (XDG standardization for
# applications, systemd.io/DESKTOP_ENVIRONMENTS), and systemd already knows how it ended. A drop-in named app-.service.d applies to
# every unit whose name starts with app- (systemd.unit(5), "foo-.service.d"). Nothing runs while a program starts or runs; one
# small command runs when it fails, and one when it ends cleanly while a death of it is kept.
[Unit]
OnFailure=sparky-stereo-gpu-died@%n.service
OnSuccess=sparky-stereo-gpu-survived@%n.service
