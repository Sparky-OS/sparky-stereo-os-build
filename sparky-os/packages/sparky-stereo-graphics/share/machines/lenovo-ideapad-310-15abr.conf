# Daniel's field laptop: Lenovo ideapad 310-15ABR, machine type 80ST, AMD A10-9600P.
# Its integrated Radeon R5 (Carrizo, 1002:9874) drives the panel and the HDMI port; the discrete
# Radeon R5 M430 (Hainan, 1002:6660) has no outputs and hands its pictures over (PRIME).
# ORDER 234, 2026-10-24: Life of Pi 3D with KWin in frame packing on the TV, software decoding, dropped
# 589.6 frames a minute rendered on the Carrizo against 65.3 on the R5 M430; copying VA-API pictures back
# dropped more than software decoding on both GPUs (65.3 to 91.9 on the R5 M430).
# sparky-stereo-gpu-record --apply-known writes it to /etc/xdg/sparky-stereo-graphicsrc on this model.
[Match]
Vendor=LENOVO
Product=80ST*
Gpus=1002:9874,1002:6660

[Measured]
BestGpu=1002:6660
Model=Lenovo ideapad 310-15ABR
Measurement=ORDER 234, 2026-10-24: Life of Pi 3D, KWin frame packing, software decoding: 589.6 dropped frames a minute on the integrated R5 (Carrizo), 65.3 on the R5 M430 (Hainan)

[Decoding]
CopyBack=false

