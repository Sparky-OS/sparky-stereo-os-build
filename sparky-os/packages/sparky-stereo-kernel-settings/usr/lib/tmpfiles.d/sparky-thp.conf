# Sparky Stereo OS: transparent huge pages. The kernel is built with THP=always (as Debian's).
# Source: CachyOS-Settings usr/lib/tmpfiles.d/thp.conf and thp-shrinker.conf (GPL-3.0).

# Only stall on compaction for madvise()d regions (tcmalloc advice): fewer latency spikes in games and browsers.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
# THP shrinker (kernel 6.12+): split huge pages that are more than 80 % (409 of 512) zero-filled, so THP=always does not inflate memory use.
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
