# Sparky Stereo OS: compressed RAM swap (systemd-zram-generator). Priority 100 puts it ahead of the disk swap the installer creates for
# hibernation (hibernation needs a disk swap area at least the size of RAM: zram cannot hold the image), so zram is used first and the disk
# swap only when zram is full or at hibernation. Source of the layout: CachyOS-Settings usr/lib/systemd/zram-generator.conf (GPL-3.0), size changed.
[zram0]
compression-algorithm = zstd
zram-size = min(ram, 8192)
swap-priority = 100
fs-type = swap
