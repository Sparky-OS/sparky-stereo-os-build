# Sparky Stereo OS: kernel tunables that replace CachyOS kernel patches and settings (userspace instead of patches, one line of reason each).
# Values and ideas: CachyOS-Settings usr/lib/sysctl.d/70-cachyos-settings.conf (GPL-3.0, github.com/CachyOS/CachyOS-Settings), the CachyOS kernel
# patches "Disable watermark boosting by default", "Disable proactive compaction by default", "Disable split lock mitigation by default",
# "Disable swap-in readahead", and Valve's SteamOS for vm.max_map_count. Every value can be changed in /etc/sysctl.d/.

# Games under Proton/Wine map many memory regions; the kernel default (65530) crashes some of them. SteamOS uses this value.
vm.max_map_count = 2147483642

# Prefer pushing anonymous pages to swap (zram first) over dropping page cache: with fast zram swap, re-reading files from disk costs more.
# The zram udev rule raises it to 150 while a zram swap device exists.
vm.swappiness = 100

# Keep directory and inode caches a little longer (default 100); makes file browsing and game asset loading less disk bound.
vm.vfs_cache_pressure = 50

# Start writing dirty data earlier and in smaller bursts: avoids long stalls when a slow USB stick is flushed (CachyOS values).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# No swap-in read-ahead: with zram or an SSD, reading neighbouring swap pages wastes more than it saves (replaces the CachyOS patch).
vm.page-cluster = 0

# No watermark boosting: less needless reclaim and kswapd work on desktops (replaces the CachyOS patch; kernel default 15000).
vm.watermark_boost_factor = 0

# No proactive compaction: avoids background CPU spikes (replaces the CachyOS patch; kernel default 20).
vm.compaction_proactiveness = 0

# Split-lock mitigation off: old Windows games under Proton that do split locks are not slowed down by 10 ms per lock (replaces the CachyOS patch).
# Trade-off: one misbehaving program can hold the memory bus; this is a desktop/handheld default, not a server one.
kernel.split_lock_mitigate = 0

# NMI watchdog off: one timer less, lower power use and latency.
kernel.nmi_watchdog = 0

# Larger receive queue for fast links, fewer dropped packets under bursts (CachyOS).
net.core.netdev_max_backlog = 4096

# Many open files: game launchers, browsers, containers (CachyOS).
fs.file-max = 2097152

# Debian's own default for unprivileged user namespaces is on; written down because series 08 adds this sysctl to our kernel.
kernel.unprivileged_userns_clone = 1

# kexec is closed after boot (Daniel, 2026-10-08): kernel.kexec_load_disabled=1 makes kexec_load(2) AND kexec_file_load(2) fail with EPERM until the next boot
# (Documentation/admin-guide/sysctl/kernel.rst), so root cannot stage another kernel once the system is up. Hibernation is not affected (hibernate and resume tested with this file).
# Measured on the real kernel under Secure Boot (hibernate-bench, scenario kexec): WITHOUT this line the old kexec_load(2) call is already refused (IMA, EACCES: "impossible to
# appraise a kernel image without a file descriptor"), an unsigned kexec_file_load(2) image is refused (kernel signature enforced) and a signed one loads. WITH this line the signed
# image is refused too (EPERM), and so is a crash (kdump) kernel: `systemctl kexec`, `kexec -s` and kdump-tools cannot load an image after this file was applied; an image that was
# loaded before stays usable. To keep kexec working, delete the next line.
kernel.kexec_load_disabled = 1
