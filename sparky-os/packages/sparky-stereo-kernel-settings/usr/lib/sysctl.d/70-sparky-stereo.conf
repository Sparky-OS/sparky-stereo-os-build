# Sparky Stereo OS: kernel tunables that replace CachyOS kernel patches and settings (userspace instead of patches, one line of reason each).
# Values and ideas: CachyOS-Settings usr/lib/sysctl.d/70-cachyos-settings.conf (GPL-3.0, github.com/CachyOS/CachyOS-Settings), the CachyOS kernel
# patches "Disable watermark boosting by default", "Disable proactive compaction by default", "Disable split lock mitigation by default",
# and Valve's SteamOS for vm.max_map_count.
# Your own values: systemd-sysctl reads /etc/sysctl.d, /run/sysctl.d and /usr/lib/sysctl.d together, sorted by file name, and the last value
# wins (sysctl.d(5)). Name your file 71-*.conf to 99-*.conf in /etc/sysctl.d (for example 99-mine.conf) and its values win over this file;
# a lower number loses to it. A file named 70-sparky-stereo.conf in /etc/sysctl.d replaces this one completely. This file is 70 so that it
# sorts after 50-default.conf (package linux-sysctl-defaults, systemd's upstream defaults), which sets vm.max_map_count = 1048576.
# Swap is the Cushion Swap File on disk, off at boot and deployed under memory pressure.
# Daniel, 2026-10-10: "vm.swappiness = 1 always".
# Our explanation, from Documentation/admin-guide/sysctl/vm.rst: swappiness 0..200
# expresses relative swap versus filesystem paging I/O cost. Low values treat swap
# as more expensive; 1 is not the minimum and does not keep every page in RAM.
# Swap read-ahead stays at the kernel default. CachyOS-Settings 9e6603a82c89 (70-cachyos-settings.conf) and Bazzite's Steam Deck 65-memory.conf both set vm.page-cluster = 0 for their zram swap; ours is a swap file on disk, where CachyOS's own comment advises 1 or 2, so the kernel default stays until Daniel decides.
# Source of the value: Daniel's design, not a distribution's (CachyOS-Settings 70-cachyos-settings.conf: 100; Bazzite deck/shared/usr/lib/sysctl.d/65-memory.conf: 180).
vm.swappiness = 1

# Games under Proton/Wine map many memory regions; the kernel default (65530) crashes some of them. SteamOS uses this value.
# Stereo needs more than 2D: a game keeps the second eye's render targets and buffers, so it can map more regions than the same game in 2D;
# other distributions chose 1048576 for 2D games. The value is only a ceiling: memory is used per mapping actually made.
# Source of the value: Bazzite (github.com/ublue-os/bazzite), main 69db4d1cf1, read 2026-11-16, system_files/desktop/shared/usr/lib/sysctl.d/70-gaming.conf (vm.max_map_count=2147483642); Proton's wiki page Requirements gives the same number.
vm.max_map_count = 2147483642

# Keep directory and inode caches a little longer (default 100); makes file browsing and game asset loading less disk bound.
# Source of the value: CachyOS-Settings (github.com/CachyOS/CachyOS-Settings, GPL-3.0), master 9e6603a82c89, read 2026-11-16, usr/lib/sysctl.d/70-cachyos-settings.conf (vm.vfs_cache_pressure = 50).
vm.vfs_cache_pressure = 50

# Start writing dirty data earlier and in smaller bursts: avoids long stalls when a slow USB stick is flushed (CachyOS values).
# Sources, read 2026-11-16, and why these stay (kernel-is-the-soul: a value both main gaming distributions ship follows them; where they differ the value stays and both are listed):
#   vm.dirty_bytes = 268435456              CachyOS-Settings f99252b4c2 (until 2026-11-09) and Bazzite deck/shared/usr/lib/sysctl.d/65-memory.conf; CachyOS-Settings 9e6603a82c89 has vm.dirty_ratio = 10 instead
#   vm.dirty_background_bytes = 67108864    CachyOS-Settings f99252b4c2; Bazzite's 65-memory.conf has 134217728; CachyOS-Settings 9e6603a82c89 has vm.dirty_background_ratio = 3
#   vm.dirty_writeback_centisecs = 1500     CachyOS-Settings f99252b4c2 only; neither CachyOS-Settings 9e6603a82c89 nor Bazzite sets it now
# CachyOS-Settings moved to ratios and a per-device cap (61-writeback-limits.rules, commit 218f5c7de3, #289, 2026-11-09). The two distributions differ, so ours stay.
# Bazzite's Steam Deck 65-memory.conf has the same vm.dirty_bytes and 134217728 for the background value. CachyOS-Settings replaced these by ratios (vm.dirty_ratio = 10, vm.dirty_background_ratio = 3) and a per-device cap in 61-writeback-limits.rules on 2026-11-09 (commit 218f5c7de3, #289); ours stay as they are until Daniel decides.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# No watermark boosting: less needless reclaim and kswapd work on desktops (replaces the CachyOS patch; kernel default 15000).
# Source of the value: Bazzite (github.com/ublue-os/bazzite), main 69db4d1cf118, read 2026-11-16, system_files/deck/shared/usr/lib/sysctl.d/65-memory.conf (vm.watermark_boost_factor=0), and CachyOS/linux tag cachyos-7.3.4-1 (tag object 102157f63c3e), mm/page_alloc.c:279-281 (0 where CONFIG_CACHY, else 15000).
vm.watermark_boost_factor = 0

# No proactive compaction: avoids background CPU spikes (replaces the CachyOS patch; kernel default 20).
# Source of the value: CachyOS/linux tag cachyos-7.3.4-1 (tag object 102157f63c3e), mm/compaction.c:1936-1939 (0 where CONFIG_CACHY, else 20), read 2026-11-16; no settings file of CachyOS-Settings or Bazzite sets it.
vm.compaction_proactiveness = 0

# Split-lock mitigation off: old Windows games under Proton that do split locks are not slowed down by 10 ms per lock (replaces the CachyOS patch).
# Trade-off: one misbehaving program can hold the memory bus; this is a desktop/handheld default, not a server one.
# Source of the value: Bazzite (github.com/ublue-os/bazzite), main 69db4d1cf1, read 2026-11-16, system_files/desktop/shared/usr/lib/sysctl.d/60-kernel.conf (kernel.split_lock_mitigate=0).
kernel.split_lock_mitigate = 0

# NMI watchdog off: one timer less, lower power use and latency.
# Source of the value: CachyOS-Settings (github.com/CachyOS/CachyOS-Settings, GPL-3.0), master 9e6603a82c89, read 2026-11-16, 70-cachyos-settings.conf (kernel.nmi_watchdog = 0).
kernel.nmi_watchdog = 0

# Larger receive queue for fast links, fewer dropped packets under bursts (CachyOS).
# Source of the value: CachyOS-Settings (github.com/CachyOS/CachyOS-Settings, GPL-3.0), master 9e6603a82c89, read 2026-11-16, 70-cachyos-settings.conf (net.core.netdev_max_backlog = 4096).
net.core.netdev_max_backlog = 4096

# Many open files: game launchers, browsers, containers (CachyOS).
# Source of the value: CachyOS-Settings (github.com/CachyOS/CachyOS-Settings, GPL-3.0), master 9e6603a82c89, read 2026-11-16, 70-cachyos-settings.conf (fs.file-max = 2097152).
fs.file-max = 2097152

# Debian's own default for unprivileged user namespaces is on; written down because series 08 adds this sysctl to our kernel.
# Source of the value: Debian's default and CachyOS-Settings (github.com/CachyOS/CachyOS-Settings, GPL-3.0), master 9e6603a82c89, read 2026-11-16, 70-cachyos-settings.conf (kernel.unprivileged_userns_clone = 1).
kernel.unprivileged_userns_clone = 1

# kexec is closed after boot (Daniel, 2026-10-08): kernel.kexec_load_disabled=1 makes kexec_load(2) AND kexec_file_load(2) fail with EPERM until the next boot
# (Documentation/admin-guide/sysctl/kernel.rst), so root cannot stage another kernel once the system is up. Hibernation is not affected (hibernate and resume tested with this file).
# Measured on the real kernel under Secure Boot (hibernate-bench, scenario kexec): WITHOUT this line the old kexec_load(2) call is already refused (IMA, EACCES: "impossible to
# appraise a kernel image without a file descriptor"), an unsigned kexec_file_load(2) image is refused (kernel signature enforced) and a signed one loads. WITH this line the signed
# image is refused too (EPERM), and so is a crash (kdump) kernel: `systemctl kexec`, `kexec -s` and kdump-tools cannot load an image after this file was applied; an image that was
# loaded before stays usable. To keep kexec working, delete the next line.
# Source of the value: Daniel's design (2026-10-08, the comment above), no distribution's.
kernel.kexec_load_disabled = 1
