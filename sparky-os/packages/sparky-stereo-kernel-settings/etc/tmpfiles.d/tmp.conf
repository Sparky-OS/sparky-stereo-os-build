# /tmp is on disk and keeps its files: no boot wipe and no age cleanup.
# Daniel, 2026-11-06: "make sure the tmp cleaner is really off - we do not want to keep the ram tmp behaviour, and was one of the reasons to move it to the disk".
# Replaces Debian's /usr/lib/tmpfiles.d/tmp.conf (q /tmp 1777 root root 10d); /var/tmp stays as Debian ships it.
q /tmp 1777 root root -
q /var/tmp 1777 root root 30d
