# Sparky Stereo OS: GRUB's background is the SparkyOS one (sparkyos-artwork).
#
# grub-mkconfig (update-grub) sources every *.cfg in /etc/default/grub.d/ after /etc/default/grub,
# and Sparky's and Debian's theme scripts (06_sparky_theme, 05_debian_theme) use GRUB_BACKGROUND
# before anything else. A background the person chose is kept: GRUB_BACKGROUND set in
# /etc/default/grub, or a picture put into /boot/grub.
if [ -z "${GRUB_BACKGROUND+x}" ] && [ -f /opt/artwork/sparkyos-grub.png ] &&
	! ls /boot/grub/*.png /boot/grub/*.PNG /boot/grub/*.jpg /boot/grub/*.JPG /boot/grub/*.jpeg \
		/boot/grub/*.JPEG /boot/grub/*.tga /boot/grub/*.TGA >/dev/null 2>&1; then
	GRUB_BACKGROUND=/opt/artwork/sparkyos-grub.png
fi
