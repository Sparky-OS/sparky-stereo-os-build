Description="在 Sparky Stereo OS 上，OBS Studio 的畫布採用全寬左右並排配置。支援的編碼器會寫入 3D 標記。立體輸入濾鏡列出所有封裝方式。"
Menu="立體 3D…"
DialogTitle="立體 3D"
EyeResolution="每隻眼睛的算繪解析度"
CanvasWillBe="開啟 3D 後，畫布為 %1 × %2：兩隻眼睛左右並排，左眼在前。"
Status.Recording="錄影"
Status.Streaming="串流"
Status.Marked="影像帶有由編碼器寫入的 3D 標記（影格封裝，左右並排，左眼在前）。"
Reason.AV1="%1：AV1 沒有影格封裝訊息。影像串流不會帶有 3D 標記。檔案仍帶有容器的標記。"
Reason.QSV="%1：OBS 的 Quick Sync 編碼器尚不傳送立體訊息。影像串流不會帶有 3D 標記。檔案仍帶有容器的標記。"
Reason.AMF="%1：AMF 無法攜帶立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.OpenH264="%1：OpenH264 不寫入立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.CustomFFmpeg="%1：自訂輸出 (FFmpeg) 會把立體排列交給它的編碼器。只有該編碼器寫入時，串流才帶有 3D 標記。libx264 與硬體編碼器會寫入。"
Reason.Unknown="%1：尚不知道此編碼器寫入 3D 標記的方法，因此影像不帶標記。"
Notice.NoStreamMark="%1：第一個畫面不帶 3D 標記。影像是兩隻眼睛左右並排的平面畫面。"
Notice.CanvasChanged="3D 已啟用。畫布為 %1 × %2，左右並排需要 %3 × %4。影像不會帶有 3D 標記。請在「工具」的「立體 3D」中重新設定畫布。"
Notice.OutputsBusy="請停止串流、錄影、重播緩衝區和虛擬相機。全部停止後，OBS 才能變更畫布。"
Notice.CanvasNotSet="OBS 沒有接受 %1 × %2 的畫布。請開啟 設定，影像 查看原因。"
Notice.Squeezed="輸出解析度 %1 × %2 與畫布形狀不同，因此每隻眼睛都會被壓扁。請在 設定，影像 中把輸出解析度設為畫布大小。"
Notice.DisplaySettingsFailed="無法開啟顯示設定：kcmshell6 kcm_kscreen 沒有啟動。"
StereoInput="立體輸入"
NotConvertedYet="這種封裝需要多個畫面。濾鏡暫時無法轉換這種封裝。兩隻眼睛看到的是同一個畫面。"
StereoInputAbout="濾鏡以全寬左右並排方式傳遞來源，左眼在前。每隻眼睛維持原有解析度。自動模式會將寬度至少為高度三倍的來源視為左右並排。其他來源在兩隻眼睛中顯示為同一個畫面。"
Notice.ScenesExist="桌面上的 3D 已開啟。此設定檔已有您的場景，因此畫布維持原樣。啟用 3D 會把它設為完整左右並排，%1 × %2。"
Notice.ModeUnknown="OBS 無法讀取螢幕的 3D 模式。它以此設定檔現有的畫布啟動。"
