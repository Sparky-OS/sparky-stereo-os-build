Description="Sparky Stereo OS 上 OBS Studio 的立體 3D：完整左右並排的畫布，由能寫入的編碼器寫入的 3D 標記，以及適用於每種封裝的立體輸入濾鏡。"
Menu="立體 3D…"
DialogTitle="立體 3D"
EyeResolution="每隻眼睛的算繪解析度"
CanvasWillBe="開啟 3D 後，畫布為 %1 × %2：兩隻眼睛左右並排，左眼在前。"
Status.Recording="錄影"
Status.Streaming="直播"
Status.Marked="影像帶有由編碼器寫入的 3D 標記（影格封裝，左右並排，左眼在前）。"
Reason.OwnX264="您自訂的 x264 選項（設定，輸出）會取代 3D 標記：請在其中加入 frame-packing=3（目前為「%1」）以標記影像。"
Reason.AV1="%1：AV1 沒有影格封裝訊息，因此影像不帶 3D 標記。"
Reason.VAAPI="%1：OBS 交給 FFmpeg 的 VA-API 編碼器的畫面不帶立體排列，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.NVENC="%1：OBS 自身的 NVENC 編碼器不向驅動程式傳送立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.QSV="%1：OBS 自身的 Quick Sync 編碼器不傳送立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.AMF="%1：AMF 無法攜帶立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.OpenH264="%1：OpenH264 不寫入立體訊息，因此影像不帶 3D 標記。x264 會寫入它。"
Reason.CustomFFmpeg="%1：自訂輸出 (FFmpeg) 在 OBS 內部編碼，不帶立體排列，因此影像不帶 3D 標記。標準錄影中的 x264 會寫入它。"
Reason.Unknown="%1：尚不知道此編碼器寫入 3D 標記的方法，因此影像不帶標記。"
Reason.Container="檔案本身的 3D 標記（Matroska 的 StereoMode，MP4 的 st3d）不會寫入：OBS 的多工器沒有得知排列。讀取影像標記的播放器會以 3D 顯示。"
Notice.NoStreamMark="%1：第一個畫面不帶 3D 標記。影像是兩隻眼睛左右並排的平面畫面。"
Notice.CanvasChanged="3D 已開啟，但畫布為 %1 × %2，而不是兩隻眼睛並排的 %3 × %4，因此不寫入 3D 標記。請在 工具，立體 3D 中重新設定畫布。"
Notice.OutputsBusy="請先停止直播、錄影、重播緩衝與虛擬相機：它們執行時 OBS 無法變更畫布。"
Notice.CanvasNotSet="OBS 沒有接受 %1 × %2 的畫布。請開啟 設定，影像 查看原因。"
Notice.Squeezed="輸出解析度 %1 × %2 與畫布形狀不同，因此每隻眼睛都會被壓扁。請在 設定，影像 中把輸出解析度設為畫布大小。"
Notice.DisplaySettingsFailed="無法開啟顯示設定：kcmshell6 kcm_kscreen 沒有啟動。"
StereoInput="立體輸入"
NotConvertedYet="這種封裝需要不只一個畫面，目前尚不轉換：來源在兩隻眼睛中顯示為同一個畫面。"
StereoInputAbout="來源以完整左右並排、左眼在前的方式傳出，每隻眼睛維持原有解析度。自動模式把寬為高三倍的來源視為左右並排，其他來源視為兩隻眼睛中的同一個畫面。"
