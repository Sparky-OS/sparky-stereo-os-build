Description="Sous Sparky Stereo OS, OBS Studio utilise un canevas en côte à côte complet. Les encodeurs compatibles écrivent la marque 3D. Le filtre Entrée stéréo répertorie tous les formats d’assemblage."
Menu="3D stéréo…"
DialogTitle="3D stéréo"
EyeResolution="Résolution de rendu par œil"
CanvasWillBe="Avec la 3D activée, le canevas mesure %1 × %2. Les deux yeux s’affichent côte à côte, œil gauche en premier."
Status.Recording="Enregistrement"
Status.Streaming="Streaming"
Status.Marked="L’encodeur a écrit la marque 3D dans la vidéo (empaquetage des images, côte à côte, œil gauche en premier)."
Reason.OwnX264="Vos propres options x264 (Paramètres, Sortie) remplacent la marque 3D : ajoutez-y frame-packing=3 (actuellement « %1 ») pour marquer la vidéo."
Reason.AV1="%1 ne peut pas écrire la marque 3D. L’AV1 n’a pas de message d’empaquetage des images."
Reason.VAAPI="%1 : OBS donne les images à l’encodeur VA-API de FFmpeg sans la disposition stéréo, la vidéo ne porte donc pas de marque 3D. x264 l’écrit."
Reason.NVENC="%1 : l’encodeur NVENC propre à OBS n’envoie aucun message stéréo au pilote, la vidéo ne porte donc pas de marque 3D. x264 l’écrit."
Reason.QSV="%1 : l’encodeur Quick Sync propre à OBS n’envoie aucun message stéréo, la vidéo ne porte donc pas de marque 3D. x264 l’écrit."
Reason.AMF="%1 : AMF ne peut pas porter le message stéréo, la vidéo ne porte donc pas de marque 3D. x264 l’écrit."
Reason.OpenH264="%1 : OpenH264 n’écrit aucun message stéréo, la vidéo ne porte donc pas de marque 3D. x264 l’écrit."
Reason.CustomFFmpeg="%1 : la Sortie Personnalisée (FFmpeg) encode dans OBS sans la disposition stéréo, la vidéo ne porte donc pas de marque 3D. x264 dans l’enregistrement standard l’écrit."
Reason.Unknown="%1 : aucun moyen connu ne permet à cet encodeur d’écrire la marque 3D, la vidéo n’en porte donc aucune."
Reason.Container="La marque 3D propre au fichier (StereoMode de Matroska, st3d de MP4) n’est pas écrite : le multiplexeur d’OBS ne reçoit pas la disposition. Les lecteurs qui lisent la marque de la vidéo l’affichent en 3D."
Notice.NoStreamMark="%1 : la première image ne porte pas de marque 3D. La vidéo est une image plate des deux yeux côte à côte."
Notice.CanvasChanged="La 3D est activée. Le canevas mesure %1 × %2 et les deux yeux côte à côte nécessitent %3 × %4. La vidéo ne portera pas la marque 3D. Réglez de nouveau le canevas dans Outils, 3D stéréo."
Notice.OutputsBusy="Arrêtez le streaming, l’enregistrement, le tampon de relecture (Replay Buffer) et la caméra virtuelle. OBS ne peut changer le canevas que lorsque ces sorties sont toutes arrêtées."
Notice.CanvasNotSet="OBS n’a pas accepté le canevas de %1 × %2. Ouvrez Paramètres, Vidéo pour en voir la raison."
Notice.Squeezed="La résolution de sortie %1 × %2 n’a pas la forme du canevas, chaque œil est donc écrasé. Réglez la résolution de sortie à la taille du canevas dans Paramètres, Vidéo."
Notice.DisplaySettingsFailed="Les paramètres d’affichage n’ont pas pu s’ouvrir : kcmshell6 kcm_kscreen n’a pas démarré."
StereoInput="Entrée stéréo"
NotConvertedYet="Ce format d’assemblage nécessite plusieurs images. Le filtre ne le convertit pas encore. Les deux yeux voient la même image."
StereoInputAbout="Le filtre transmet la source en côte à côte complet, œil gauche en premier. Chaque œil garde sa propre résolution. En mode Automatique, les sources au moins trois fois plus larges que hautes sont traitées comme du côte à côte. Dans les autres cas, les deux yeux voient la même image."
