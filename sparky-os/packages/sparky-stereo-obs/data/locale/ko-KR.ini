Description="Sparky Stereo OS의 OBS Studio는 캔버스에 두 눈의 영상을 좌우 나란히 원래 해상도로 배치합니다. 지원하는 인코더는 3D 표시를 기록합니다. 스테레오 입력 필터에는 모든 패킹이 표시됩니다."
Menu="스테레오 3D…"
DialogTitle="스테레오 3D"
EyeResolution="눈당 렌더링 해상도"
CanvasWillBe="3D를 켜면 캔버스는 %1 × %2입니다. 두 눈의 영상은 좌우 나란히 배치되며 왼쪽 눈 먼저 표시됩니다."
Status.Recording="녹화"
Status.Streaming="스트리밍"
Status.Marked="인코더가 영상에 3D 표시를 기록했습니다(프레임 패킹, 좌우 나란히, 왼쪽 눈 먼저)."
Reason.OwnX264="직접 지정한 x264 옵션(설정, 출력)이 3D 표시를 대체합니다. 영상에 표시하려면 거기에 frame-packing=3을 추가하세요(현재 \"%1\")."
Reason.AV1="%1: AV1에는 프레임 패킹 메시지가 없으므로 영상에 3D 표시가 없습니다."
Reason.VAAPI="%1: OBS가 FFmpeg의 VA-API 인코더에 스테레오 배치 없이 이미지를 넘기므로 영상에 3D 표시가 없습니다. x264는 이를 씁니다."
Reason.NVENC="%1: OBS 자체 NVENC 인코더는 드라이버에 스테레오 메시지를 보내지 않으므로 영상에 3D 표시가 없습니다. x264는 이를 씁니다."
Reason.QSV="%1: OBS 자체 Quick Sync 인코더는 스테레오 메시지를 보내지 않으므로 영상에 3D 표시가 없습니다. x264는 이를 씁니다."
Reason.AMF="%1: AMF는 스테레오 메시지를 실어 보낼 수 없으므로 영상에 3D 표시가 없습니다. x264는 이를 씁니다."
Reason.OpenH264="%1: OpenH264는 스테레오 메시지를 쓰지 않으므로 영상에 3D 표시가 없습니다. x264는 이를 씁니다."
Reason.CustomFFmpeg="%1: 임의 출력 (FFmpeg)은 OBS 안에서 스테레오 배치 없이 인코딩하므로 영상에 3D 표시가 없습니다. 표준 녹화의 x264는 이를 씁니다."
Reason.Unknown="%1: 이 인코더가 3D 표시를 쓰는 방법은 알려져 있지 않으므로 영상에 표시가 없습니다."
Reason.Container="Matroska의 StereoMode, MP4의 st3d 같은 파일 자체의 3D 표시는 기록되지 않습니다. OBS는 파일을 만들 때 스테레오 배치 정보를 전달하지 않습니다. 영상의 3D 표시를 읽는 재생기는 영상을 3D로 표시합니다."
Notice.NoStreamMark="%1: 첫 이미지에 3D 표시가 없습니다. 영상은 두 눈을 나란히 놓은 평면 이미지입니다."
Notice.CanvasChanged="3D가 켜져 있습니다. 캔버스는 %1 × %2이고, 두 눈의 영상을 좌우 나란히 놓으려면 %3 × %4가 필요합니다. 영상에 3D 표시가 기록되지 않습니다. 도구의 스테레오 3D에서 캔버스를 다시 설정하세요."
Notice.OutputsBusy="스트리밍, 녹화, 리플레이 버퍼, 가상 카메라를 중지하세요. 모두 중지해야 OBS에서 캔버스를 바꿀 수 있습니다."
Notice.CanvasNotSet="OBS가 캔버스 %1 × %2를 받아들이지 않았습니다. 이유는 설정, 비디오에서 확인하세요."
Notice.Squeezed="출력 해상도 %1 × %2가 캔버스 모양과 달라 각 눈이 찌그러집니다. 설정, 비디오에서 출력 해상도를 캔버스 크기로 맞추세요."
Notice.DisplaySettingsFailed="디스플레이 설정을 열 수 없습니다: kcmshell6 kcm_kscreen이 시작되지 않았습니다."
StereoInput="스테레오 입력"
NotConvertedYet="이 패킹에는 이미지가 두 장 이상 필요합니다. 필터는 아직 이 패킹을 변환하지 못합니다. 두 눈에 같은 이미지가 표시됩니다."
StereoInputAbout="필터는 두 눈의 영상을 좌우 나란히 전달합니다. 왼쪽 눈 먼저 배치하고 각 눈의 해상도는 그대로 유지합니다. 자동 모드에서는 너비가 높이의 세 배 이상인 소스를 좌우 나란히 배치된 것으로 처리합니다. 그 밖의 소스는 두 눈에 같은 이미지가 표시됩니다."
