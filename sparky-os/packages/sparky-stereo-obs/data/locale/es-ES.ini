Description="En Sparky Stereo OS, OBS Studio usa un lienzo en lado a lado completo. Los codificadores compatibles escriben la marca 3D. El filtro Entrada estéreo enumera todos los empaquetados."
Menu="3D estéreo…"
DialogTitle="3D estéreo"
EyeResolution="Resolución de renderizado por ojo"
CanvasWillBe="Con el 3D activado, el lienzo mide %1 × %2. Los dos ojos se muestran lado a lado, ojo izquierdo primero."
Status.Recording="Grabación"
Status.Streaming="Emisión"
Status.Marked="El codificador escribió la marca 3D en el vídeo (empaquetado de fotogramas, lado a lado, ojo izquierdo primero)."
Reason.AV1="%1: AV1 no tiene mensaje de empaquetado de fotogramas. El flujo de vídeo no tendrá marca 3D. El archivo sigue llevando la marca del contenedor."
Reason.QSV="%1: el codificador Quick Sync de OBS aún no envía el mensaje estéreo. El flujo de vídeo no tendrá marca 3D. El archivo sigue llevando la marca del contenedor."
Reason.AMF="%1: AMF no puede llevar el mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.OpenH264="%1: OpenH264 no escribe ningún mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.CustomFFmpeg="%1: la Salida personalizada (FFmpeg) entrega la disposición estéreo a su codificador. El flujo solo tendrá la marca 3D si ese codificador la escribe. libx264 y los codificadores de hardware lo hacen."
Reason.Unknown="%1: no se conoce ninguna forma de que este codificador escriba la marca 3D, así que el vídeo no lleva ninguna."
Notice.NoStreamMark="%1: la primera imagen no lleva marca 3D. El vídeo es una imagen plana de los dos ojos lado a lado."
Notice.CanvasChanged="El 3D está activado. El lienzo mide %1 × %2 y los dos ojos lado a lado necesitan %3 × %4. El vídeo no llevará la marca 3D. Vuelve a ajustar el lienzo en Herramientas, 3D estéreo."
Notice.OutputsBusy="Detén la emisión, la grabación, el búfer de repetición y la cámara virtual. OBS solo puede cambiar el lienzo cuando todas esas salidas están detenidas."
Notice.CanvasNotSet="OBS no aceptó el lienzo de %1 × %2. Abre Ajustes, Vídeo para ver por qué."
Notice.Squeezed="La resolución de salida %1 × %2 no tiene la forma del lienzo, así que cada ojo queda comprimido. Ajusta la resolución de salida al tamaño del lienzo en Ajustes, Vídeo."
Notice.DisplaySettingsFailed="No se pudo abrir la configuración de pantalla: kcmshell6 kcm_kscreen no se inició."
StereoInput="Entrada estéreo"
Notice.ScenesExist="El 3D está activo en el escritorio. Este perfil ya tiene tus escenas, así que su lienzo se queda como está. Activar 3D lo pone en lado a lado completo, %1 × %2."
Notice.ModeUnknown="OBS no pudo leer el modo 3D de las pantallas. Se inicia con el lienzo que tiene este perfil."
