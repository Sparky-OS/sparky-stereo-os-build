Description="3D estéreo para OBS Studio en Sparky Stereo OS: un lienzo lado a lado completo, la marca 3D escrita por los codificadores que saben escribirla y un filtro de entrada estéreo para cada empaquetado."
Menu="3D estéreo…"
DialogTitle="3D estéreo"
EyeResolution="Resolución de renderizado por ojo"
CanvasWillBe="Con el 3D activado, el lienzo mide %1 × %2: los dos ojos lado a lado, primero el izquierdo."
Status.Recording="Grabación"
Status.Streaming="Transmisión"
Status.Marked="El vídeo lleva la marca 3D (empaquetado de fotogramas, lado a lado, primero el ojo izquierdo), escrita por el codificador."
Reason.OwnX264="Tus propias opciones de x264 (Ajustes, Salida) reemplazan la marca 3D: añádeles frame-packing=3 (ahora «%1») para marcar el vídeo."
Reason.AV1="%1: AV1 no tiene mensaje de empaquetado de fotogramas, así que el vídeo no lleva marca 3D."
Reason.VAAPI="%1: OBS entrega las imágenes al codificador VA-API de FFmpeg sin la disposición estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.NVENC="%1: el codificador NVENC propio de OBS no envía al controlador ningún mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.QSV="%1: el codificador Quick Sync propio de OBS no envía ningún mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.AMF="%1: AMF no puede llevar el mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.OpenH264="%1: OpenH264 no escribe ningún mensaje estéreo, así que el vídeo no lleva marca 3D. x264 la escribe."
Reason.CustomFFmpeg="%1: la Salida personalizada (FFmpeg) codifica dentro de OBS sin la disposición estéreo, así que el vídeo no lleva marca 3D. x264 en la grabación estándar la escribe."
Reason.Unknown="%1: no se conoce ninguna forma de que este codificador escriba la marca 3D, así que el vídeo no lleva ninguna."
Reason.Container="La marca 3D propia del archivo (StereoMode de Matroska, st3d de MP4) no se escribe: al multiplexor de OBS no se le indica la disposición. Los reproductores que leen la marca del vídeo lo muestran en 3D."
Notice.NoStreamMark="%1: la primera imagen no lleva marca 3D. El vídeo es una imagen plana de los dos ojos lado a lado."
Notice.CanvasChanged="El 3D está activado, pero el lienzo mide %1 × %2, no los %3 × %4 de dos ojos lado a lado, así que no se escribe ninguna marca 3D. Vuelve a ajustar el lienzo en Herramientas, 3D estéreo."
Notice.OutputsBusy="Detén primero la transmisión, la grabación, el búfer de repetición y la cámara virtual: OBS no puede cambiar el lienzo mientras funcionan."
Notice.CanvasNotSet="OBS no aceptó el lienzo de %1 × %2. Abre Ajustes, Vídeo para ver por qué."
Notice.Squeezed="La resolución de salida %1 × %2 no tiene la forma del lienzo, así que cada ojo queda comprimido. Ajusta la resolución de salida al tamaño del lienzo en Ajustes, Vídeo."
Notice.DisplaySettingsFailed="No se pudo abrir la configuración de pantalla: kcmshell6 kcm_kscreen no se inició."
StereoInput="Entrada estéreo"
NotConvertedYet="Este empaquetado necesita más de una imagen y aún no se convierte: la fuente se ve como una sola imagen en los dos ojos."
StereoInputAbout="La fuente se entrega como lado a lado completo, primero el ojo izquierdo, cada ojo con su propia resolución. Automático toma una fuente tres veces más ancha que alta como lado a lado, y cualquier otra como una sola imagen en los dos ojos."
