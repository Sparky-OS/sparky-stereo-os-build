Reason.AV1="%1: AV1 nie ma komunikatu o upakowaniu klatek. Strumień wideo nie będzie miał znacznika 3D. Plik nadal niesie znacznik kontenera."
Reason.QSV="%1: koder Quick Sync programu OBS nie wysyła jeszcze komunikatu stereo. Strumień wideo nie będzie miał znacznika 3D. Plik nadal niesie znacznik kontenera."
