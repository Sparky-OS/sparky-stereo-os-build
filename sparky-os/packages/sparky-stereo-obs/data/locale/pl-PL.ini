Description="W Sparky Stereo OS program OBS Studio używa obrazu bazowego w pełnym układzie obok siebie. Zgodne enkodery zapisują znacznik 3D. Filtr Wejście stereo zawiera wszystkie układy."
Menu="Stereo 3D…"
