Description="W Sparky Stereo OS program OBS Studio używa obrazu bazowego w pełnym układzie obok siebie. Zgodne enkodery zapisują znacznik 3D. Filtr Wejście stereo zawiera wszystkie układy."
Menu="Stereo 3D…"
DialogTitle="Stereo 3D"
EyeResolution="Rozdzielczość renderowania na oko"
CanvasWillBe="Przy włączonym 3D obraz bazowy ma %1 × %2. Obrazy są obok siebie, lewe oko pierwsze."
Status.Recording="Nagrywanie"
Status.Streaming="Transmisja"
Status.Marked="Enkoder zapisał znacznik 3D w wideo (pakowanie klatek, obok siebie, lewe oko pierwsze)."
Reason.OwnX264="Twoje własne opcje x264 (Ustawienia, Wyjście) zastępują znacznik 3D: dodaj do nich frame-packing=3 (teraz „%1”), aby oznaczyć wideo."
Reason.AV1="%1: AV1 nie ma komunikatu o pakowaniu klatek. Wideo nie ma więc znacznika 3D."
Reason.VAAPI="%1: OBS przekazuje obrazy enkoderowi VA-API z FFmpeg bez układu stereo, więc wideo nie niesie znacznika 3D. x264 go zapisuje."
Reason.NVENC="%1: własny enkoder NVENC programu OBS nie wysyła sterownikowi komunikatu stereo, więc wideo nie niesie znacznika 3D. x264 go zapisuje."
Reason.QSV="%1: własny enkoder Quick Sync programu OBS nie wysyła komunikatu stereo, więc wideo nie niesie znacznika 3D. x264 go zapisuje."
Reason.AMF="%1: AMF nie może przenieść komunikatu stereo, więc wideo nie niesie znacznika 3D. x264 go zapisuje."
Reason.OpenH264="%1: OpenH264 nie zapisuje komunikatu stereo, więc wideo nie niesie znacznika 3D. x264 go zapisuje."
Reason.CustomFFmpeg="%1: Tryb „Niestandardowe ustawienia (FFmpeg)” koduje w OBS bez układu stereo. Wideo nie ma więc znacznika 3D. Przy nagrywaniu standardowym x264 zapisuje ten znacznik."
Reason.Unknown="%1: nie jest znany sposób, by ten enkoder zapisał znacznik 3D, więc wideo go nie niesie."
Reason.Container="Własny znacznik 3D pliku (StereoMode w Matroska, st3d w MP4) nie jest zapisywany: muxer OBS nie dostaje informacji o układzie. Odtwarzacze, które czytają znacznik wideo, pokazują je w 3D."
Notice.NoStreamMark="%1: pierwszy obraz nie niesie znacznika 3D. Wideo jest płaskim obrazem obu oczu obok siebie."
Notice.CanvasChanged="3D jest włączone. Obraz bazowy ma %1 × %2, a układ obok siebie wymaga %3 × %4. Wideo nie będzie miało znacznika 3D. Ustaw ponownie obraz bazowy w menu Narzędzia, Stereo 3D."
Notice.OutputsBusy="Zatrzymaj transmisję, nagrywanie, nagrywanie powtórek i kamerę wirtualną. OBS może zmienić obraz bazowy dopiero po zatrzymaniu ich wszystkich."
Notice.CanvasNotSet="OBS nie przyjął obrazu bazowego %1 × %2. Otwórz Ustawienia, Obraz, aby zobaczyć dlaczego."
Notice.Squeezed="Rozdzielczość wynikowa %1 × %2 nie ma kształtu obrazu bazowego, więc każde oko jest ściśnięte. Ustaw rozdzielczość wynikową na rozmiar obrazu bazowego w Ustawienia, Obraz."
Notice.DisplaySettingsFailed="Nie udało się otworzyć opcji „Ustawienia ekranu”. Polecenie kcmshell6 kcm_kscreen się nie uruchomiło."
StereoInput="Wejście stereo"
NotConvertedYet="Ten układ wymaga kilku obrazów. Filtr jeszcze go nie przekształca. Oba oczy widzą ten sam obraz."
StereoInputAbout="Filtr przekazuje pełne obrazy obok siebie, lewe oko pierwsze. Każde oko zachowuje swoją rozdzielczość. W trybie Automatycznie źródło, którego szerokość jest co najmniej trzykrotnością wysokości, jest traktowane jako układ obok siebie. W innych przypadkach oba oczy widzą ten sam obraz."
