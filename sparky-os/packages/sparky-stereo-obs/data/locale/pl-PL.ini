Notice.Squeezed="Rozdzielczość wynikowa %1 × %2 nie ma kształtu obrazu bazowego, więc każde oko jest ściśnięte. Ustaw rozdzielczość wynikową na rozmiar obrazu bazowego w Ustawienia, Obraz."
Notice.DisplaySettingsFailed="Nie udało się otworzyć opcji „Ustawienia ekranu”. Polecenie kcmshell6 kcm_kscreen się nie uruchomiło."
