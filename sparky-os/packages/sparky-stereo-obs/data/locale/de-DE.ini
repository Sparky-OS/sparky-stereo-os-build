Description="OBS Studio verwendet unter Sparky Stereo OS eine Leinwand mit vollständig nebeneinander angeordneten Ansichten. Unterstützte Kodierer schreiben die 3D-Markierung. Der Filter Stereo-Eingang listet alle Packungen auf."
Menu="Stereo-3D …"
DialogTitle="Stereo-3D"
EyeResolution="Renderauflösung pro Auge"
CanvasWillBe="Mit eingeschaltetem 3D ist die Leinwand %1 × %2 groß. Die Ansichten liegen nebeneinander, linkes Auge zuerst."
Status.Recording="Aufnahme"
Status.Streaming="Stream"
Status.Marked="Der Kodierer hat die 3D-Markierung ins Video geschrieben (Frame-Packing, nebeneinander, linkes Auge zuerst)."
Reason.OwnX264="Ihre eigenen x264-Optionen (Einstellungen, Ausgabe) ersetzen die 3D-Markierung: Fügen Sie ihnen frame-packing=3 hinzu (jetzt „%1“), um das Video zu markieren."
Reason.AV1="%1: AV1 hat keine Frame-Packing-Nachricht, daher trägt das Video keine 3D-Markierung."
Reason.VAAPI="%1: OBS übergibt dem VA-API-Kodierer von FFmpeg die Bilder ohne die Stereoanordnung, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.NVENC="%1: Der eigene NVENC-Kodierer von OBS sendet dem Treiber keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.QSV="%1: Der eigene Quick-Sync-Kodierer von OBS sendet keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.AMF="%1: AMF kann die Stereonachricht nicht transportieren, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.OpenH264="%1: OpenH264 schreibt keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.CustomFFmpeg="%1: Der Aufnahmetyp „Benutzerdefinierte Ausgabe (FFmpeg)“ kodiert in OBS ohne Stereoanordnung. Das Video trägt daher keine 3D-Markierung. Bei der Standardaufnahme schreibt x264 die Markierung."
Reason.Unknown="%1: Für diesen Kodierer ist kein Weg bekannt, die 3D-Markierung zu schreiben, daher trägt das Video keine."
Reason.Container="Die eigene 3D-Markierung der Datei (Matroska-StereoMode, MP4-st3d) wird nicht geschrieben: Dem Muxer von OBS wird die Anordnung nicht mitgeteilt. Player, die die Markierung des Videos lesen, zeigen es in 3D."
Notice.NoStreamMark="%1: Das erste Bild trägt keine 3D-Markierung. Das Video ist ein flaches Bild der beiden Augen nebeneinander."
Notice.CanvasChanged="3D ist eingeschaltet. Die Leinwand ist %1 × %2 groß. Für beide Augen nebeneinander sind %3 × %4 nötig. Das Video erhält keine 3D-Markierung. Stellen Sie die Leinwand unter Werkzeuge, Stereo-3D erneut ein."
Notice.OutputsBusy="Beenden Sie den Stream, die Aufnahme, den Replaypuffer und die virtuelle Kamera. OBS kann die Leinwand erst ändern, wenn alle diese Ausgaben beendet sind."
Notice.CanvasNotSet="OBS hat die Leinwand %1 × %2 nicht übernommen. Öffnen Sie Einstellungen, Video, um den Grund zu sehen."
Notice.Squeezed="Die Ausgabeauflösung %1 × %2 hat nicht die Form der Leinwand, daher wird jedes Auge gestaucht. Stellen Sie unter Einstellungen, Video die Ausgabeauflösung auf die Größe der Leinwand."
Notice.DisplaySettingsFailed="Die Anzeigeeinstellungen konnten nicht geöffnet werden: kcmshell6 kcm_kscreen ist nicht gestartet."
StereoInput="Stereo-Eingang"
NotConvertedYet="Diese Packung benötigt mehrere Bilder. Der Filter wandelt sie noch nicht um. Beide Augen sehen dasselbe Bild."
StereoInputAbout="Der Filter gibt beide Ansichten vollständig nebeneinander aus, linkes Auge zuerst. Jedes Auge behält seine Auflösung. Im Modus Automatisch gilt eine Quelle als nebeneinander angeordnet, wenn sie mindestens dreimal so breit wie hoch ist. Bei anderen Quellen sehen beide Augen dasselbe Bild."
