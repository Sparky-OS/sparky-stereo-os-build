Description="Stereo-3D für OBS Studio unter Sparky Stereo OS: eine Leinwand mit voller Seite-an-Seite-Anordnung, die 3D-Markierung, geschrieben von den Encodern, die sie schreiben können, und ein Stereo-Eingangsfilter für jede Packung."
Menu="Stereo-3D …"
DialogTitle="Stereo-3D"
EyeResolution="Renderauflösung pro Auge"
CanvasWillBe="Mit eingeschaltetem 3D ist die Leinwand %1 × %2: die beiden Augen nebeneinander, das linke zuerst."
Status.Recording="Aufnahme"
Status.Streaming="Stream"
Status.Marked="Das Video trägt die 3D-Markierung (Frame-Packing, Seite an Seite, linkes Auge zuerst), vom Encoder geschrieben."
Reason.OwnX264="Ihre eigenen x264-Optionen (Einstellungen, Ausgabe) ersetzen die 3D-Markierung: Fügen Sie ihnen frame-packing=3 hinzu (jetzt „%1“), um das Video zu markieren."
Reason.AV1="%1: AV1 hat keine Frame-Packing-Nachricht, daher trägt das Video keine 3D-Markierung."
Reason.VAAPI="%1: OBS übergibt dem VA-API-Encoder von FFmpeg die Bilder ohne die Stereoanordnung, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.NVENC="%1: Der eigene NVENC-Encoder von OBS sendet dem Treiber keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.QSV="%1: Der eigene Quick-Sync-Encoder von OBS sendet keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.AMF="%1: AMF kann die Stereonachricht nicht transportieren, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.OpenH264="%1: OpenH264 schreibt keine Stereonachricht, daher trägt das Video keine 3D-Markierung. x264 schreibt sie."
Reason.CustomFFmpeg="%1: Die benutzerdefinierte Ausgabe (FFmpeg) kodiert in OBS ohne die Stereoanordnung, daher trägt das Video keine 3D-Markierung. x264 in der Standardaufnahme schreibt sie."
Reason.Unknown="%1: Für diesen Encoder ist kein Weg bekannt, die 3D-Markierung zu schreiben, daher trägt das Video keine."
Reason.Container="Die eigene 3D-Markierung der Datei (Matroska-StereoMode, MP4-st3d) wird nicht geschrieben: Dem Muxer von OBS wird die Anordnung nicht mitgeteilt. Player, die die Markierung des Videos lesen, zeigen es in 3D."
Notice.NoStreamMark="%1: Das erste Bild trägt keine 3D-Markierung. Das Video ist ein flaches Bild der beiden Augen nebeneinander."
Notice.CanvasChanged="3D ist eingeschaltet, aber die Leinwand ist %1 × %2, nicht %3 × %4 für zwei Augen nebeneinander, daher wird keine 3D-Markierung geschrieben. Stellen Sie die Leinwand unter Werkzeuge, Stereo-3D erneut ein."
Notice.OutputsBusy="Beenden Sie zuerst Stream, Aufnahme, Replaypuffer und virtuelle Kamera: OBS kann die Leinwand nicht ändern, solange sie laufen."
Notice.CanvasNotSet="OBS hat die Leinwand %1 × %2 nicht übernommen. Öffnen Sie Einstellungen, Video, um den Grund zu sehen."
Notice.Squeezed="Die Ausgabeauflösung %1 × %2 hat nicht die Form der Leinwand, daher wird jedes Auge gestaucht. Stellen Sie unter Einstellungen, Video die Ausgabeauflösung auf die Größe der Leinwand."
Notice.DisplaySettingsFailed="Die Anzeigeeinstellungen konnten nicht geöffnet werden: kcmshell6 kcm_kscreen ist nicht gestartet."
StereoInput="Stereo-Eingang"
NotConvertedYet="Diese Packung braucht mehr als ein Bild und wird noch nicht umgewandelt: Die Quelle erscheint als ein Bild in beiden Augen."
StereoInputAbout="Die Quelle wird als volles Seite an Seite weitergegeben, linkes Auge zuerst, jedes Auge in seiner eigenen Auflösung. Automatisch nimmt eine Quelle, die dreimal so breit wie hoch ist, als Seite an Seite und jede andere als ein Bild in beiden Augen."
