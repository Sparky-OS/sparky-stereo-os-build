Description="Sparky Stereo OS の OBS Studio では、キャンバスがフルサイドバイサイドになります。対応するエンコーダが 3D マークを書き込みます。ステレオ入力フィルターにはすべてのパッキングが表示されます。"
Menu="ステレオ 3D…"
DialogTitle="ステレオ 3D"
EyeResolution="片目あたりのレンダリング解像度"
CanvasWillBe="3D を有効にすると、キャンバスは %1 × %2 になります。サイドバイサイド、左目が先です。"
Status.Recording="録画"
Status.Streaming="配信"
Status.Marked="映像には 3D マーク（フレームパッキング、サイドバイサイド、左目が先）があり、エンコーダが書き込みます。"
Reason.AV1="%1：AV1 にはフレームパッキングのメッセージがありません。映像ストリームに 3D マークは付きません。ファイルにはコンテナのマークが付きます。"
Reason.QSV="%1：OBS の Quick Sync エンコーダーはまだステレオのメッセージを送りません。映像ストリームに 3D マークは付きません。ファイルにはコンテナのマークが付きます。"
Reason.AMF="%1：AMF にはステレオのメッセージを運ぶ手段がないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.OpenH264="%1：OpenH264 はステレオのメッセージを書き込まないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.CustomFFmpeg="%1：カスタム出力 (FFmpeg) はエンコーダーにステレオ配置を渡します。そのエンコーダーが書き込む場合だけ、ストリームに 3D マークが付きます。libx264 とハードウェアエンコーダーは書き込みます。"
Reason.Unknown="%1：このエンコーダが 3D マークを書き込む方法は知られていないため、映像にマークは付きません。"
Notice.NoStreamMark="%1：最初の画像に 3D マークがありません。映像は左右の目を横に並べた平面の画像です。"
Notice.CanvasChanged="3D は有効です。キャンバスは %1 × %2 ですが、サイドバイサイドには %3 × %4 が必要です。映像に 3D マークは付きません。「ツール」の「ステレオ 3D」でキャンバスを設定し直してください。"
Notice.OutputsBusy="配信、録画、リプレイバッファ、仮想カメラを停止してください。すべて停止すると、OBS でキャンバスを変更できます。"
Notice.CanvasNotSet="OBS はキャンバス %1 × %2 を受け付けませんでした。理由は設定、映像で確認してください。"
Notice.Squeezed="出力解像度 %1 × %2 がキャンバスの形と異なるため、各目が押しつぶされます。設定、映像で出力解像度をキャンバスの大きさにしてください。"
Notice.DisplaySettingsFailed="「ディスプレイの設定」を開けませんでした。kcmshell6 kcm_kscreen が起動しませんでした。"
StereoInput="ステレオ入力"
Notice.ScenesExist="デスクトップで 3D が有効です。このプロファイルにはすでにシーンがあるため、キャンバスはそのままです。3D を有効にすると、フルサイドバイサイドの %1 × %2 になります。"
Notice.ModeUnknown="OBS は画面の 3D モードを読み取れませんでした。このプロファイルのキャンバスのまま起動します。"
