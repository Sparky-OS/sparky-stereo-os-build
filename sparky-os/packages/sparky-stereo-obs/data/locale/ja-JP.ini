Description="Sparky Stereo OS の OBS Studio 向けステレオ 3D：フルサイドバイサイドのキャンバス、書き込めるエンコーダーによる 3D マーク、あらゆるパッキングに対応するステレオ入力フィルター。"
Menu="ステレオ 3D…"
DialogTitle="ステレオ 3D"
EyeResolution="片目あたりのレンダリング解像度"
CanvasWillBe="3D をオンにすると、キャンバスは %1 × %2 になります：左右の目を横に並べ、左目が先です。"
Status.Recording="録画"
Status.Streaming="配信"
Status.Marked="映像には 3D マーク（フレームパッキング、サイドバイサイド、左目が先）があり、エンコーダーが書き込みます。"
Reason.OwnX264="独自の x264 オプション（設定、出力）が 3D マークを置き換えます。映像にマークを付けるには、そこに frame-packing=3 を追加してください（現在「%1」）。"
Reason.AV1="%1：AV1 にはフレームパッキングのメッセージがないため、映像に 3D マークは付きません。"
Reason.VAAPI="%1：OBS は FFmpeg の VA-API エンコーダーにステレオ配置なしで画像を渡すため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.NVENC="%1：OBS 独自の NVENC エンコーダーはドライバーにステレオのメッセージを送らないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.QSV="%1：OBS 独自の Quick Sync エンコーダーはステレオのメッセージを送らないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.AMF="%1：AMF にはステレオのメッセージを運ぶ手段がないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.OpenH264="%1：OpenH264 はステレオのメッセージを書き込まないため、映像に 3D マークは付きません。x264 なら書き込みます。"
Reason.CustomFFmpeg="%1：カスタム出力 (FFmpeg) は OBS の中でステレオ配置なしにエンコードするため、映像に 3D マークは付きません。標準の録画の x264 なら書き込みます。"
Reason.Unknown="%1：このエンコーダーが 3D マークを書き込む方法は知られていないため、映像にマークは付きません。"
Reason.Container="ファイル自体の 3D マーク（Matroska の StereoMode、MP4 の st3d）は書き込まれません：OBS のマルチプレクサーに配置が伝えられないためです。映像のマークを読むプレーヤーは 3D で表示します。"
Notice.NoStreamMark="%1：最初の画像に 3D マークがありません。映像は左右の目を横に並べた平面の画像です。"
Notice.CanvasChanged="3D はオンですが、キャンバスが %1 × %2 で、左右の目を並べた %3 × %4 ではないため、3D マークは書き込まれません。ツール、ステレオ 3D でキャンバスを設定し直してください。"
Notice.OutputsBusy="先に配信、録画、リプレイバッファ、仮想カメラを停止してください：動作中は OBS がキャンバスを変更できません。"
Notice.CanvasNotSet="OBS はキャンバス %1 × %2 を受け付けませんでした。理由は設定、映像で確認してください。"
Notice.Squeezed="出力解像度 %1 × %2 がキャンバスの形と異なるため、各目が押しつぶされます。設定、映像で出力解像度をキャンバスの大きさにしてください。"
Notice.DisplaySettingsFailed="ディスプレイ設定を開けませんでした：kcmshell6 kcm_kscreen が起動しませんでした。"
StereoInput="ステレオ入力"
NotConvertedYet="このパッキングには複数の画像が必要で、まだ変換されません：ソースは両目に 1 枚の画像として表示されます。"
StereoInputAbout="ソースはフルサイドバイサイド、左目が先、各目は元の解像度のまま渡されます。自動では、幅が高さの 3 倍あるソースをサイドバイサイドとし、それ以外は両目に 1 枚の画像とします。"
