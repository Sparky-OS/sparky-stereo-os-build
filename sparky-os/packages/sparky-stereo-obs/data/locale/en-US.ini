Description="Stereo 3D for OBS Studio on Sparky Stereo OS: a full side by side canvas, the 3D mark written by the encoders that can write it, and a Stereo input filter for every packing."
Menu="Stereo 3D…"
DialogTitle="Stereo 3D"
EyeResolution="Render resolution per eye"
CanvasWillBe="With 3D on, the canvas is %1 × %2: the two eyes side by side, left eye first."
Status.Recording="Recording"
Status.Streaming="Streaming"
Status.Marked="The video carries the 3D mark (frame packing, side by side, left eye first), written by the encoder."
Reason.OwnX264="Your own x264 options (Settings, Output) replace the 3D mark: add frame-packing=3 to them (now \"%1\") to mark the video."
Reason.AV1="%1: AV1 has no frame packing message, so the video carries no 3D mark."
Reason.VAAPI="%1: OBS hands FFmpeg's VA-API encoder its pictures without the stereo layout, so the video carries no 3D mark. x264 writes it."
Reason.NVENC="%1: OBS's own NVENC encoder sends the driver no stereo message, so the video carries no 3D mark. x264 writes it."
Reason.QSV="%1: OBS's own Quick Sync encoder sends no stereo message, so the video carries no 3D mark. x264 writes it."
Reason.AMF="%1: AMF has no way to carry the stereo message, so the video carries no 3D mark. x264 writes it."
Reason.OpenH264="%1: OpenH264 writes no stereo message, so the video carries no 3D mark. x264 writes it."
Reason.CustomFFmpeg="%1: the custom FFmpeg output encodes inside OBS without the stereo layout, so the video carries no 3D mark. x264 in the standard recording writes it."
Reason.Unknown="%1: this encoder has no known way to write the 3D mark, so the video carries none."
Reason.Container="The file's own 3D mark (Matroska StereoMode, MP4 st3d) is not written: OBS's muxer is not told the layout. Players that read the video's mark show it in 3D."
Notice.NoStreamMark="%1: the first picture carries no 3D mark. The video is a flat picture of the two eyes side by side."
Notice.CanvasChanged="3D is on, but the canvas is %1 × %2, not the %3 × %4 of two eyes side by side, so no 3D mark is written. Set the canvas again in Tools, Stereo 3D."
Notice.OutputsBusy="Stop streaming, recording, the replay buffer and the virtual camera first: OBS cannot change the canvas while they run."
Notice.CanvasNotSet="OBS did not take the canvas %1 × %2. Open Settings, Video to see why."
Notice.Squeezed="The output resolution %1 × %2 does not have the canvas's shape, so each eye is squeezed. Set the output resolution to the canvas size in Settings, Video."
Notice.DisplaySettingsFailed="Display Settings could not be opened: kcmshell6 kcm_kscreen did not start."
StereoInput="Stereo input"
NotConvertedYet="This packing needs more than one picture and is not converted yet: the source shows as one picture in both eyes."
StereoInputAbout="The source is handed on as full side by side, left eye first, each eye at the resolution it has. Automatic takes a source three times as wide as high as side by side, and any other as one picture in both eyes."
