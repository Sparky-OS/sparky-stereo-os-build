Description="No Sparky Stereo OS, o OBS Studio usa uma área de edição em lado a lado completo. Os codificadores compatíveis gravam a marca 3D. O filtro Entrada estéreo lista todos os empacotamentos."
Menu="3D estéreo…"
DialogTitle="3D estéreo"
EyeResolution="Resolução de renderização por olho"
CanvasWillBe="Com o 3D ativado, a área de edição tem %1 × %2: os dois olhos lado a lado, o olho esquerdo primeiro."
Status.Recording="Gravação"
Status.Streaming="Transmissão"
Status.Marked="O vídeo leva a marca 3D (empacotamento de quadros, lado a lado, olho esquerdo primeiro), escrita pelo codificador."
Reason.OwnX264="Suas próprias opções do x264 (Configurações, Saída) substituem a marca 3D: acrescente frame-packing=3 a elas (agora \"%1\") para marcar o vídeo."
Reason.AV1="%1: o AV1 não tem mensagem de empacotamento de quadros, então o vídeo não leva marca 3D."
Reason.VAAPI="%1: o OBS entrega as imagens ao codificador VA-API do FFmpeg sem o arranjo estéreo, então o vídeo não leva marca 3D. O x264 a escreve."
Reason.NVENC="%1: o codificador NVENC do próprio OBS não envia ao driver nenhuma mensagem estéreo, então o vídeo não leva marca 3D. O x264 a escreve."
Reason.QSV="%1: o codificador Quick Sync do próprio OBS não envia mensagem estéreo, então o vídeo não leva marca 3D. O x264 a escreve."
Reason.AMF="%1: o AMF não tem como levar a mensagem estéreo, então o vídeo não leva marca 3D. O x264 a escreve."
Reason.OpenH264="%1: o OpenH264 não escreve mensagem estéreo, então o vídeo não leva marca 3D. O x264 a escreve."
Reason.CustomFFmpeg="%1: a Saída personalizada (FFmpeg) codifica dentro do OBS sem o arranjo estéreo, então o vídeo não leva marca 3D. O x264 na gravação padrão a escreve."
Reason.Unknown="%1: não se conhece maneira de este codificador escrever a marca 3D, então o vídeo não leva nenhuma."
Reason.Container="A marca 3D do próprio arquivo (StereoMode do Matroska, st3d do MP4) não é escrita: o multiplexador do OBS não é informado do arranjo. Os reprodutores que leem a marca do vídeo o mostram em 3D."
Notice.NoStreamMark="%1: a primeira imagem não leva marca 3D. O vídeo é uma imagem plana dos dois olhos lado a lado."
Notice.CanvasChanged="O 3D está ativado. A área de edição tem %1 × %2 e os dois olhos lado a lado precisam de %3 × %4. O vídeo vai ficar sem a marca 3D. Ajuste a área de edição em Ferramentas, 3D estéreo."
Notice.OutputsBusy="Pare a transmissão, a gravação, o buffer de repetição e a câmera virtual. O OBS só muda a área de edição quando todos estiverem parados."
Notice.CanvasNotSet="O OBS não aceitou a área de edição de %1 × %2. Abra Configurações, Vídeo para ver por quê."
Notice.Squeezed="A resolução de saída %1 × %2 não tem a forma da área de edição, então cada olho fica espremido. Ajuste a resolução de saída ao tamanho da área de edição em Configurações, Vídeo."
Notice.DisplaySettingsFailed="Não foi possível abrir as Configurações de tela: kcmshell6 kcm_kscreen não iniciou."
StereoInput="Entrada estéreo"
NotConvertedYet="Este empacotamento precisa de mais de uma imagem e ainda não é convertido. A mesma imagem aparece nos dois olhos."
StereoInputAbout="O filtro passa a fonte em lado a lado completo, olho esquerdo primeiro. Cada olho mantém a própria resolução. No modo Automático, uma fonte com largura de pelo menos três vezes a altura é tratada como lado a lado. Nos outros casos, a mesma imagem aparece nos dois olhos."
