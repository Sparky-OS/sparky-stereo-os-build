Description="在 Sparky Stereo OS 上，OBS Studio 的画布采用全宽左右并排布局。支持的编码器会写入 3D 标记。立体输入滤镜列出所有封装方式。"
Menu="立体 3D…"
DialogTitle="立体 3D"
EyeResolution="每只眼睛的渲染分辨率"
CanvasWillBe="开启 3D 后，画布为 %1 × %2：两只眼睛左右并排，左眼在前。"
Status.Recording="录制"
Status.Streaming="直播"
Status.Marked="视频带有由编码器写入的 3D 标记（帧封装，左右并排，左眼在前）。"
Reason.OwnX264="您自己的 x264 选项（设置，输出）会替换 3D 标记：请在其中加入 frame-packing=3（当前为“%1”）以标记视频。"
Reason.AV1="%1：AV1 没有帧封装消息，因此视频不带 3D 标记。"
Reason.VAAPI="%1：OBS 交给 FFmpeg 的 VA-API 编码器的画面不带立体排列，因此视频不带 3D 标记。x264 会写入它。"
Reason.NVENC="%1：OBS 自带的 NVENC 编码器不向驱动发送立体消息，因此视频不带 3D 标记。x264 会写入它。"
Reason.QSV="%1：OBS 自带的 Quick Sync 编码器不发送立体消息，因此视频不带 3D 标记。x264 会写入它。"
Reason.AMF="%1：AMF 无法携带立体消息，因此视频不带 3D 标记。x264 会写入它。"
Reason.OpenH264="%1：OpenH264 不写入立体消息，因此视频不带 3D 标记。x264 会写入它。"
Reason.CustomFFmpeg="%1：自定义输出 (FFmpeg) 在 OBS 内部编码，不带立体排列，因此视频不带 3D 标记。标准录制中的 x264 会写入它。"
Reason.Unknown="%1：尚不知道此编码器写入 3D 标记的方法，因此视频不带标记。"
Reason.Container="文件本身的 3D 标记（Matroska 的 StereoMode，MP4 的 st3d）不会写入：OBS 的复用器没有得知排列。读取视频标记的播放器会以 3D 显示。"
Notice.NoStreamMark="%1：第一帧画面不带 3D 标记。视频是两只眼睛左右并排的平面画面。"
Notice.CanvasChanged="3D 已启用。画布为 %1 × %2，左右并排需要 %3 × %4。视频不会带有 3D 标记。请在“工具”的“立体 3D”中重新设置画布。"
Notice.OutputsBusy="请停止直播、录制、回放缓存和虚拟摄像机。全部停止后，OBS 才能更改画布。"
Notice.CanvasNotSet="OBS 没有接受 %1 × %2 的画布。请打开 设置，视频 查看原因。"
Notice.Squeezed="输出分辨率 %1 × %2 与画布形状不同，因此每只眼睛都会被压扁。请在 设置，视频 中把输出分辨率设为画布大小。"
Notice.DisplaySettingsFailed="无法打开显示设置：kcmshell6 kcm_kscreen 没有启动。"
StereoInput="立体输入"
NotConvertedYet="这种封装需要多幅画面。滤镜暂时无法转换这种封装。两只眼睛看到的是同一幅画面。"
StereoInputAbout="滤镜以全宽左右并排方式传递来源，左眼在前。每只眼睛保持原有分辨率。自动模式会将宽度至少为高度三倍的来源视为左右并排。其他来源在两只眼睛中显示为同一幅画面。"
