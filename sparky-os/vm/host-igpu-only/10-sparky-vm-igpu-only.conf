# Temporary (VM run): SDDM's X server uses only the iGPU (AMD 5600G, PCI 0b:00.0 =
# 11:0:0 in decimal), so the RTX 3060 stays free for the VM. Goes in /etc/X11/xorg.conf.d/;
# delete it after the run.
Section "ServerFlags"
    Option "AutoAddGPU" "off"
    Option "AutoBindGPU" "off"
EndSection

Section "Device"
    Identifier "iGPU"
    Driver     "amdgpu"
    BusID      "PCI:11:0:0"
EndSection
